name: Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    environment: prod

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}

      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # PNPM
      # package.json provides:
      # "packageManager": "pnpm@11.21.0"
      # =========================================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v4


      # =========================================================
      # NODE
      # =========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm


      # =========================================================
      # INSTALL
      # =========================================================

      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      # =========================================================
      # BUILD
      # =========================================================

      - name: Build
        run: pnpm build


      # =========================================================
      # INSTALL CLOUDFLARED
      # =========================================================

      - name: Install cloudflared
        run: |
          sudo curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          echo "Cloudflared:"
          cloudflared --version


      # =========================================================
      # SSH KEY
      # =========================================================

      - name: Configure SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          echo "SSH private key installed."


      # =========================================================
      # SSH CONFIG
      # =========================================================

      - name: Configure Cloudflare SSH
        run: |
          cat > "$HOME/.ssh/config" <<EOF
          Host production
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF

          chmod 600 "$HOME/.ssh/config"

          echo "SSH configuration:"
          cat "$HOME/.ssh/config"


      # =========================================================
      # VALIDATE SECRETS WITHOUT PRINTING THEM
      # =========================================================

      - name: Validate connection configuration
        run: |
          test -n "$SSH_HOST" || {
            echo "SSH_HOST is missing"
            exit 1
          }

          test -n "$SSH_USER" || {
            echo "SSH_USER is missing"
            exit 1
          }

          test -n "$TUNNEL_SERVICE_TOKEN_ID" || {
            echo "CF_ACCESS_CLIENT_ID is missing"
            exit 1
          }

          test -n "$TUNNEL_SERVICE_TOKEN_SECRET" || {
            echo "CF_ACCESS_CLIENT_SECRET is missing"
            exit 1
          }

          test -s "$HOME/.ssh/id_ed25519" || {
            echo "SSH_PRIVATE_KEY is missing"
            exit 1
          }

          echo "Connection configuration OK."


      # =========================================================
      # TEST CLOUDFLARE + SSH + VPS
      # =========================================================

      - name: Test VPS connection
        run: |
          ssh production '
            set -e

            echo "======================================"
            echo " GitHub Actions SSH SUCCESS"
            echo "======================================"
            echo

            echo "Hostname:"
            hostname

            echo
            echo "User:"
            whoami

            echo
            echo "Kernel:"
            uname -r

            echo
            echo "Docker:"
            docker --version

            echo
            echo "Docker services:"
            docker service ls || true
          '


      # =========================================================
      # DEPLOY
      # Replace contents later with actual deploy commands.
      # =========================================================

      - name: Deploy
        run: |
          ssh production '
            set -e

            echo "======================================"
            echo " DEPLOY CONNECTION SUCCESS"
            echo "======================================"

            echo
            echo "Build succeeded."
            echo "SSH succeeded."
            echo "Cloudflare Access succeeded."
            echo
            echo "Ready for real deployment commands."
          '


      # =========================================================
      # CLEANUP
      # =========================================================

      - name: Cleanup SSH credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
          rm -f "$HOME/.ssh/config"

          echo "Temporary SSH credentials removed."