name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: prod

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}

      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # Database target on VPS
      DB_TARGET: your-web-page-payload-kavlug
      DB_TARGET_PORT: "27017"
      DB_NETWORK: dokploy-network

      # Port exposed locally on the GitHub runner
      DB_LOCAL_PORT: "27018"

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # =========================================================
      # INSTALL CLOUDFLARED
      # =========================================================

      - name: Install cloudflared
        run: |
          set -euo pipefail

          sudo curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          cloudflared --version


      # =========================================================
      # INSTALL SSH KEY
      # =========================================================

      - name: Install SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          echo "SSH private key installed."


      # =========================================================
      # CONFIGURE SSH THROUGH CLOUDFLARE
      # =========================================================

      - name: Configure SSH
        run: |
          set -euo pipefail

          cat > "$HOME/.ssh/config" <<EOF
          Host production
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF

          chmod 600 "$HOME/.ssh/config"


      # =========================================================
      # VALIDATE CONFIG
      # =========================================================

      - name: Validate configuration
        run: |
          set -euo pipefail

          test -n "$SSH_HOST" || {
            echo "ERROR: SSH_HOST missing"
            exit 1
          }

          test -n "$SSH_USER" || {
            echo "ERROR: SSH_USER missing"
            exit 1
          }

          test -n "$TUNNEL_SERVICE_TOKEN_ID" || {
            echo "ERROR: CF_ACCESS_CLIENT_ID missing"
            exit 1
          }

          test -n "$TUNNEL_SERVICE_TOKEN_SECRET" || {
            echo "ERROR: CF_ACCESS_CLIENT_SECRET missing"
            exit 1
          }

          test -s "$HOME/.ssh/id_ed25519" || {
            echo "ERROR: SSH_PRIVATE_KEY missing"
            exit 1
          }

          echo "Configuration OK."


      # =========================================================
      # TEST CLOUDFLARE + SSH
      # =========================================================

      - name: Test VPS connection
        run: |
          set -euo pipefail

          ssh production '
            set -e

            echo "======================================"
            echo " GitHub Actions SSH SUCCESS"
            echo "======================================"

            echo
            echo "Hostname: $(hostname)"
            echo "User:     $(whoami)"

            echo
            echo "Docker:"
            docker --version

            echo
            echo "Tunnel helper:"
            test -x /usr/local/bin/docker-tunnel-helper
            echo "Available"
          '


      # =========================================================
      # CREATE SERVER-SIDE DATABASE PROXY
      # =========================================================
      - name: Prepare database tunnel
        id: db
        run: |
          set -euo pipefail

          echo "======================================"
          echo " PREPARE DATABASE TUNNEL"
          echo "======================================"

          set +e

          RESULT="$(
            ssh production \
              "/usr/local/bin/docker-tunnel-helper prepare '$DB_TARGET' '$DB_TARGET_PORT' '$DB_NETWORK'" \
              2>&1
          )"

          EXIT_CODE=$?

          set -e

          echo
          echo "Helper output:"
          echo "--------------------------------------"
          printf '%s\n' "$RESULT"
          echo "--------------------------------------"
          echo

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "ERROR: docker-tunnel-helper failed with exit code $EXIT_CODE"
            exit "$EXIT_CODE"
          fi

          STATUS="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^STATUS=//p' |
            head -n 1
          )"

          SESSION_ID="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^SESSION_ID=//p' |
            head -n 1
          )"

          REMOTE_HOST="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^HOST=//p' |
            head -n 1
          )"

          REMOTE_PORT="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^PORT=//p' |
            head -n 1
          )"

          PROXY_NAME="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^PROXY_NAME=//p' |
            head -n 1
          )"

          if [ "$STATUS" != "OK" ]; then
            echo "ERROR: Helper did not return STATUS=OK"
            exit 1
          fi

          test -n "$SESSION_ID"
          test -n "$REMOTE_HOST"
          test -n "$REMOTE_PORT"

          echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
          echo "remote_host=$REMOTE_HOST" >> "$GITHUB_OUTPUT"
          echo "remote_port=$REMOTE_PORT" >> "$GITHUB_OUTPUT"
          echo "proxy_name=$PROXY_NAME" >> "$GITHUB_OUTPUT"

          printf '%s\n' "$SESSION_ID" > /tmp/db-tunnel-session

          echo
          echo "Tunnel prepared successfully."
          echo "Session: $SESSION_ID"
          echo "Proxy:   $PROXY_NAME"
          echo "Remote:  $REMOTE_HOST:$REMOTE_PORT"

      # =========================================================
      # CONSTRUCT DATABASE URL
      # =========================================================

      - name: Construct database URL
        run: |
          echo "======================================"
          echo " DATABASE URL"
          echo "======================================"

          # TODO:
          #
          # Construct DATABASE_URI using:
          #
          # host:
          #   127.0.0.1
          #
          # port:
          #   $DB_LOCAL_PORT
          #
          # credentials:
          #   production DB secrets
          #
          # Then write:
          #
          # echo "DATABASE_URI=..." >> "$GITHUB_ENV"
          #
          # DO NOT print the complete URI/password.

          echo "// TODO: construct DATABASE_URI"


      # =========================================================
      # INSTALL
      # =========================================================

      - name: Install dependencies
        run: |
          echo "======================================"
          echo " INSTALL"
          echo "======================================"

          echo "// TODO: setup Node"
          echo "// TODO: setup pnpm"
          echo "// TODO: pnpm install --frozen-lockfile"


      # =========================================================
      # BUILD
      # =========================================================

      - name: Build application
        run: |
          echo "======================================"
          echo " BUILD"
          echo "======================================"

          echo "// TODO: pnpm build"


      # =========================================================
      # DEPLOY
      # =========================================================

      - name: Deploy application
        run: |
          echo "======================================"
          echo " DEPLOY"
          echo "======================================"

          echo "// TODO: deploy application"


      # =========================================================
      # CLEANUP DATABASE TUNNEL
      #
      # ALWAYS RUN
      # =========================================================

      - name: Cleanup database tunnel
        if: always()
        run: |
          set +e

          echo "======================================"
          echo " DATABASE TUNNEL CLEANUP"
          echo "======================================"

          # -----------------------------------------------------
          # 1. Stop GitHub runner's local SSH forward
          # -----------------------------------------------------

          if [ -f /tmp/db-ssh-tunnel.pid ]; then

            SSH_PID="$(cat /tmp/db-ssh-tunnel.pid)"

            echo "Stopping SSH tunnel PID: $SSH_PID"

            if kill -0 "$SSH_PID" 2>/dev/null; then
              kill "$SSH_PID" 2>/dev/null

              sleep 1

              if kill -0 "$SSH_PID" 2>/dev/null; then
                echo "Force stopping SSH tunnel..."
                kill -9 "$SSH_PID" 2>/dev/null
              fi
            fi

            rm -f /tmp/db-ssh-tunnel.pid

          else
            echo "No local SSH tunnel process found."
          fi


          # -----------------------------------------------------
          # 2. Tell VPS helper to destroy its Docker proxy
          # -----------------------------------------------------

          if [ -f /tmp/db-tunnel-session ]; then

            SESSION_ID="$(cat /tmp/db-tunnel-session)"

            echo
            echo "Cleaning VPS session:"
            echo "  $SESSION_ID"

            CLEANUP_RESULT="$(
              ssh production \
                "/usr/local/bin/docker-tunnel-helper cleanup '$SESSION_ID'" \
                2>&1
            )"

            CLEANUP_EXIT=$?

            echo "$CLEANUP_RESULT"

            if [ "$CLEANUP_EXIT" -ne 0 ]; then
              echo "WARNING: VPS tunnel cleanup command failed."
            fi

            rm -f /tmp/db-tunnel-session

          else
            echo "No VPS tunnel session was created."
          fi


          echo
          echo "Database tunnel cleanup complete."


      # =========================================================
      # VERIFY CLEANUP
      # =========================================================

      - name: Verify database tunnel cleanup
        if: always()
        run: |
          set +e

          echo "======================================"
          echo " VERIFY TUNNEL CLEANUP"
          echo "======================================"

          echo
          echo "Remaining VPS tunnel containers:"

          ssh production \
            "/usr/local/bin/docker-tunnel-helper list" \
            || true


      # =========================================================
      # CLEANUP SSH CREDENTIALS
      #
      # MUST BE LAST
      # =========================================================

      - name: Cleanup SSH credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
          rm -f "$HOME/.ssh/config"

          echo "SSH credentials removed."