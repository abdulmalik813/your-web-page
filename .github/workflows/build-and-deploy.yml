name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: prod

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}

      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # REQUIRED FORMAT:
      # target,port,network
      #
      # Example:
      # your-web-page-payload-abc123,27017,dokploy-network
      TUNNEL_TARGET_PORT_NETWORK: ${{ secrets.TUNNEL_TARGET_PORT_NETWORK }}

      # Local port used only inside the GitHub runner
      DB_LOCAL_PORT: "27018"

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # =========================================================
      # INSTALL CLOUDFLARED
      # =========================================================

      - name: Install cloudflared
        run: |
          set -euo pipefail

          sudo curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          cloudflared --version


      # =========================================================
      # INSTALL SSH PRIVATE KEY
      # =========================================================

      - name: Install SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          echo "SSH private key installed."


      # =========================================================
      # CONFIGURE SSH THROUGH CLOUDFLARE
      # =========================================================

      - name: Configure SSH
        run: |
          set -euo pipefail

          cat > "$HOME/.ssh/config" <<EOF
          Host production
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF

          chmod 600 "$HOME/.ssh/config"


      # =========================================================
      # VALIDATE BASE CONFIGURATION
      # =========================================================

      - name: Validate configuration
        run: |
          set -euo pipefail

          test -n "$SSH_HOST" || {
            echo "ERROR: SSH_HOST is missing"
            exit 1
          }

          test -n "$SSH_USER" || {
            echo "ERROR: SSH_USER is missing"
            exit 1
          }

          test -n "$TUNNEL_SERVICE_TOKEN_ID" || {
            echo "ERROR: CF_ACCESS_CLIENT_ID is missing"
            exit 1
          }

          test -n "$TUNNEL_SERVICE_TOKEN_SECRET" || {
            echo "ERROR: CF_ACCESS_CLIENT_SECRET is missing"
            exit 1
          }

          test -n "$TUNNEL_TARGET_PORT_NETWORK" || {
            echo "ERROR: TUNNEL_TARGET_PORT_NETWORK is missing"
            exit 1
          }

          test -s "$HOME/.ssh/id_ed25519" || {
            echo "ERROR: SSH_PRIVATE_KEY is missing"
            exit 1
          }

          echo "Base configuration OK."


      # =========================================================
      # TEST CLOUDFLARE + SSH
      # =========================================================

      - name: Test VPS connection
        run: |
          set -euo pipefail

          ssh production '
            set -e

            echo "======================================"
            echo " GitHub Actions SSH SUCCESS"
            echo "======================================"

            echo
            echo "Hostname: $(hostname)"
            echo "User:     $(whoami)"

            echo
            echo "Docker:"
            docker --version

            echo
            echo "Tunnel helper:"
            test -x /usr/local/bin/docker-tunnel-helper
            echo "Available"
          '


      # =========================================================
      # PARSE + VALIDATE TUNNEL SECRET
      #
      # MUST BE EXACTLY:
      # target,port,network
      # =========================================================

      - name: Validate tunnel configuration
        id: tunnel-config
        run: |
          set -euo pipefail

          echo "======================================"
          echo " VALIDATE TUNNEL CONFIGURATION"
          echo "======================================"

          VALUE="$TUNNEL_TARGET_PORT_NETWORK"

          # -----------------------------------------------------
          # Require EXACTLY 2 commas = exactly 3 fields
          # -----------------------------------------------------

          COMMA_COUNT="$(
            printf '%s' "$VALUE" \
              | tr -cd ',' \
              | wc -c
          )"

          if [ "$COMMA_COUNT" -ne 2 ]; then
            echo "ERROR: TUNNEL_TARGET_PORT_NETWORK must contain exactly 3 values."
            echo "Expected format:"
            echo "  target,port,network"
            echo
            echo "Expected exactly 2 commas."
            echo "Found: $COMMA_COUNT"
            exit 1
          fi


          # -----------------------------------------------------
          # Parse exactly 3 values
          # -----------------------------------------------------

          IFS=',' read -r DB_TARGET DB_TARGET_PORT DB_NETWORK <<< "$VALUE"


          # -----------------------------------------------------
          # Trim surrounding whitespace
          # -----------------------------------------------------

          DB_TARGET="$(printf '%s' "$DB_TARGET" | xargs)"
          DB_TARGET_PORT="$(printf '%s' "$DB_TARGET_PORT" | xargs)"
          DB_NETWORK="$(printf '%s' "$DB_NETWORK" | xargs)"


          # -----------------------------------------------------
          # All 3 MUST exist
          # -----------------------------------------------------

          if [ -z "$DB_TARGET" ]; then
            echo "ERROR: Tunnel target is empty."
            exit 1
          fi

          if [ -z "$DB_TARGET_PORT" ]; then
            echo "ERROR: Tunnel target port is empty."
            exit 1
          fi

          if [ -z "$DB_NETWORK" ]; then
            echo "ERROR: Tunnel network is empty."
            exit 1
          fi


          # -----------------------------------------------------
          # Port MUST be numeric
          # -----------------------------------------------------

          case "$DB_TARGET_PORT" in
            *[!0-9]*|'')
              echo "ERROR: Tunnel target port must be numeric."
              exit 1
              ;;
          esac


          # -----------------------------------------------------
          # Port MUST be 1-65535
          # -----------------------------------------------------

          if [ "$DB_TARGET_PORT" -lt 1 ] || \
             [ "$DB_TARGET_PORT" -gt 65535 ]; then
            echo "ERROR: Tunnel target port must be between 1 and 65535."
            exit 1
          fi


          # -----------------------------------------------------
          # Names must contain only characters accepted by
          # docker-tunnel-helper
          # -----------------------------------------------------

          if ! [[ "$DB_TARGET" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: Invalid tunnel target name."
            exit 1
          fi

          if ! [[ "$DB_NETWORK" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: Invalid Docker network name."
            exit 1
          fi


          # -----------------------------------------------------
          # Save outputs
          # -----------------------------------------------------

          echo "target=$DB_TARGET" >> "$GITHUB_OUTPUT"
          echo "port=$DB_TARGET_PORT" >> "$GITHUB_OUTPUT"
          echo "network=$DB_NETWORK" >> "$GITHUB_OUTPUT"

          echo
          echo "Tunnel configuration valid."
          echo "Target:  $DB_TARGET"
          echo "Port:    $DB_TARGET_PORT"
          echo "Network: $DB_NETWORK"


      # =========================================================
      # CREATE SERVER-SIDE DATABASE PROXY
      # =========================================================

      - name: Prepare database tunnel
        id: db
        env:
          DB_TARGET: ${{ steps.tunnel-config.outputs.target }}
          DB_TARGET_PORT: ${{ steps.tunnel-config.outputs.port }}
          DB_NETWORK: ${{ steps.tunnel-config.outputs.network }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo " PREPARE DATABASE TUNNEL"
          echo "======================================"

          set +e

          RESULT="$(
            ssh production \
              "/usr/local/bin/docker-tunnel-helper prepare '$DB_TARGET' '$DB_TARGET_PORT' '$DB_NETWORK'" \
              2>&1
          )"

          EXIT_CODE=$?

          set -e

          echo
          echo "Helper output:"
          echo "--------------------------------------"
          printf '%s\n' "$RESULT"
          echo "--------------------------------------"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo
            echo "ERROR: docker-tunnel-helper failed with exit code $EXIT_CODE"
            exit "$EXIT_CODE"
          fi


          # -----------------------------------------------------
          # Parse helper response
          # -----------------------------------------------------

          STATUS="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^STATUS=//p' |
            head -n 1
          )"

          SESSION_ID="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^SESSION_ID=//p' |
            head -n 1
          )"

          REMOTE_HOST="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^HOST=//p' |
            head -n 1
          )"

          REMOTE_PORT="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^PORT=//p' |
            head -n 1
          )"

          PROXY_NAME="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^PROXY_NAME=//p' |
            head -n 1
          )"


          # -----------------------------------------------------
          # Validate helper response
          # -----------------------------------------------------

          if [ "$STATUS" != "OK" ]; then
            echo "ERROR: Tunnel helper did not return STATUS=OK."
            exit 1
          fi

          test -n "$SESSION_ID" || {
            echo "ERROR: Missing SESSION_ID"
            exit 1
          }

          test -n "$REMOTE_HOST" || {
            echo "ERROR: Missing HOST"
            exit 1
          }

          test -n "$REMOTE_PORT" || {
            echo "ERROR: Missing PORT"
            exit 1
          }

          case "$REMOTE_PORT" in
            *[!0-9]*|'')
              echo "ERROR: Invalid remote proxy port."
              exit 1
              ;;
          esac


          # -----------------------------------------------------
          # Persist BEFORE next step
          #
          # Cleanup uses this even if another step later fails.
          # -----------------------------------------------------

          printf '%s\n' "$SESSION_ID" \
            > /tmp/db-tunnel-session


          # -----------------------------------------------------
          # GitHub outputs
          # -----------------------------------------------------

          echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
          echo "remote_host=$REMOTE_HOST" >> "$GITHUB_OUTPUT"
          echo "remote_port=$REMOTE_PORT" >> "$GITHUB_OUTPUT"
          echo "proxy_name=$PROXY_NAME" >> "$GITHUB_OUTPUT"

          echo
          echo "Tunnel proxy created successfully."
          echo "Session: $SESSION_ID"
          echo "Proxy:   $PROXY_NAME"
          echo "VPS:     $REMOTE_HOST:$REMOTE_PORT"


      # =========================================================
      # OPEN GITHUB RUNNER -> VPS SSH FORWARD
      # =========================================================

      - name: Open database SSH tunnel
        id: db-forward
        env:
          REMOTE_HOST: ${{ steps.db.outputs.remote_host }}
          REMOTE_PORT: ${{ steps.db.outputs.remote_port }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo " OPEN DATABASE SSH TUNNEL"
          echo "======================================"

          # -----------------------------------------------------
          # Validate local port
          # -----------------------------------------------------

          case "$DB_LOCAL_PORT" in
            *[!0-9]*|'')
              echo "ERROR: DB_LOCAL_PORT must be numeric."
              exit 1
              ;;
          esac

          if [ "$DB_LOCAL_PORT" -lt 1 ] || \
             [ "$DB_LOCAL_PORT" -gt 65535 ]; then
            echo "ERROR: DB_LOCAL_PORT must be between 1 and 65535."
            exit 1
          fi


          # -----------------------------------------------------
          # Make sure local port is free
          # -----------------------------------------------------

          if nc -z 127.0.0.1 "$DB_LOCAL_PORT" 2>/dev/null; then
            echo "ERROR: Local port $DB_LOCAL_PORT is already in use."
            exit 1
          fi


          # -----------------------------------------------------
          # Open SSH forward
          # -----------------------------------------------------

          ssh \
            -N \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -L "${DB_LOCAL_PORT}:${REMOTE_HOST}:${REMOTE_PORT}" \
            production &

          SSH_PID=$!

          printf '%s\n' "$SSH_PID" \
            > /tmp/db-ssh-tunnel.pid

          echo "SSH tunnel PID: $SSH_PID"


          # -----------------------------------------------------
          # Wait for local tunnel
          # -----------------------------------------------------

          READY=0

          for _ in $(seq 1 20); do

            if ! kill -0 "$SSH_PID" 2>/dev/null; then
              echo "ERROR: SSH tunnel process exited unexpectedly."
              exit 1
            fi

            if nc -z -w 1 127.0.0.1 "$DB_LOCAL_PORT" 2>/dev/null; then
              READY=1
              break
            fi

            sleep 0.5
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Database tunnel did not become ready."
            exit 1
          fi


          # -----------------------------------------------------
          # Save output
          # -----------------------------------------------------

          echo "local_port=$DB_LOCAL_PORT" >> "$GITHUB_OUTPUT"

          echo
          echo "Database tunnel ACTIVE"
          echo "Local endpoint:"
          echo "  127.0.0.1:$DB_LOCAL_PORT"


      # =========================================================
      # CONSTRUCT DATABASE URL
      # =========================================================

      - name: Construct database URL
        run: |
          echo "======================================"
          echo " DATABASE URL"
          echo "======================================"

          # TODO:
          #
          # Construct DATABASE_URI using:
          #
          # 127.0.0.1
          # $DB_LOCAL_PORT
          #
          # Plus DB credentials.
          #
          # Then:
          #
          # echo "DATABASE_URI=..." >> "$GITHUB_ENV"
          #
          # DO NOT print the complete connection string.

          echo "// TODO: construct DATABASE_URI"


      # =========================================================
      # INSTALL
      # =========================================================

      - name: Install dependencies
        run: |
          echo "======================================"
          echo " INSTALL"
          echo "======================================"

          echo "// TODO: setup Node"
          echo "// TODO: setup pnpm"
          echo "// TODO: pnpm install --frozen-lockfile"


      # =========================================================
      # BUILD
      # =========================================================

      - name: Build application
        run: |
          echo "======================================"
          echo " BUILD"
          echo "======================================"

          echo "// TODO: pnpm build"


      # =========================================================
      # DEPLOY
      # =========================================================

      - name: Deploy application
        run: |
          echo "======================================"
          echo " DEPLOY"
          echo "======================================"

          echo "// TODO: deploy application"


      # =========================================================
      # CLEANUP DATABASE TUNNEL
      #
      # ALWAYS RUNS
      # =========================================================

      - name: Cleanup database tunnel
        if: always()
        run: |
          set +e

          echo "======================================"
          echo " DATABASE TUNNEL CLEANUP"
          echo "======================================"

          # -----------------------------------------------------
          # 1. Stop GitHub runner SSH tunnel
          # -----------------------------------------------------

          if [ -f /tmp/db-ssh-tunnel.pid ]; then

            SSH_PID="$(cat /tmp/db-ssh-tunnel.pid)"

            echo "Stopping local SSH tunnel PID: $SSH_PID"

            if kill -0 "$SSH_PID" 2>/dev/null; then

              kill "$SSH_PID" 2>/dev/null

              for _ in $(seq 1 10); do
                if ! kill -0 "$SSH_PID" 2>/dev/null; then
                  break
                fi

                sleep 0.2
              done

              if kill -0 "$SSH_PID" 2>/dev/null; then
                echo "Force stopping SSH tunnel..."
                kill -9 "$SSH_PID" 2>/dev/null
              fi

            fi

            rm -f /tmp/db-ssh-tunnel.pid

          else
            echo "No local SSH tunnel process found."
          fi


          # -----------------------------------------------------
          # 2. Remove VPS Docker proxy using SAME helper
          # -----------------------------------------------------

          if [ -f /tmp/db-tunnel-session ]; then

            SESSION_ID="$(cat /tmp/db-tunnel-session)"

            echo
            echo "Cleaning VPS session:"
            echo "  $SESSION_ID"

            CLEANUP_RESULT="$(
              ssh production \
                "/usr/local/bin/docker-tunnel-helper cleanup '$SESSION_ID'" \
                2>&1
            )"

            CLEANUP_EXIT=$?

            printf '%s\n' "$CLEANUP_RESULT"

            if [ "$CLEANUP_EXIT" -ne 0 ]; then
              echo "WARNING: VPS tunnel cleanup failed."
            fi

            rm -f /tmp/db-tunnel-session

          else
            echo "No VPS tunnel session was created."
          fi


          echo
          echo "Database tunnel cleanup complete."


      # =========================================================
      # VERIFY CLEANUP
      # =========================================================

      - name: Verify database tunnel cleanup
        if: always()
        run: |
          set +e

          echo "======================================"
          echo " VERIFY TUNNEL CLEANUP"
          echo "======================================"

          ssh production \
            "/usr/local/bin/docker-tunnel-helper list" \
            || true


      # =========================================================
      # CLEANUP SSH CREDENTIALS
      #
      # MUST BE LAST
      # =========================================================

      - name: Cleanup SSH credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
          rm -f "$HOME/.ssh/config"

          echo "SSH credentials removed."