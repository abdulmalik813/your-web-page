name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DB_LOCAL_PORT: "27018"

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: prod

    steps:
      # =========================================================
      # LOAD SINGLE ENV JSON SECRET
      #
      # GitHub secret:
      # ENV
      #
      # Expected:
      # {
      #   "SSH_HOST": "...",
      #   "SSH_USER": "...",
      #   "SSH_PRIVATE_KEY": "...",
      #   ...
      # }
      #
      # IMPORTANT:
      # Do NOT echo parsed values.
      # Do NOT use set -x.
      # Do NOT call add-mask on multiline values.
      # =========================================================

      - name: Load environment
        env:
          ENV_JSON: ${{ secrets.ENV }}
        run: |
          set -euo pipefail

          if [ -z "$ENV_JSON" ]; then
            echo "ERROR: ENV secret is missing."
            exit 1
          fi

          if ! printf '%s' "$ENV_JSON" \
            | jq -e 'type == "object"' \
            >/dev/null
          then
            echo "ERROR: ENV must be a valid JSON object."
            exit 1
          fi

          # Keep original JSON privately for the Docker build.
          printf '%s' "$ENV_JSON" > /tmp/source-env.json
          chmod 600 /tmp/source-env.json

          # Export all JSON keys to future GitHub Actions steps.
          #
          # The base64 wrapper safely handles:
          # - spaces
          # - quotes
          # - special characters
          # - multiline SSH keys
          while IFS= read -r ENTRY; do

            DECODED="$(
              printf '%s' "$ENTRY" |
              base64 --decode
            )"

            KEY="$(
              printf '%s' "$DECODED" |
              jq -r '.key'
            )"

            VALUE="$(
              printf '%s' "$DECODED" |
              jq -r '
                if .value == null then
                  ""
                elif (.value | type) == "string" then
                  .value
                else
                  (.value | tostring)
                end
              '
            )"

            if ! [[ "$KEY" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "ERROR: ENV contains an invalid variable name."
              exit 1
            fi

            DELIMITER="__ENV_${RANDOM}_${RANDOM}_${RANDOM}__"

            {
              echo "${KEY}<<${DELIMITER}"
              printf '%s\n' "$VALUE"
              echo "${DELIMITER}"
            } >> "$GITHUB_ENV"

          done < <(
            printf '%s' "$ENV_JSON" |
            jq -r 'to_entries[] | @base64'
          )

          echo "Environment loaded successfully."


      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # =========================================================
      # VALIDATE ONLY REQUIRED CI / TUNNEL VALUES
      #
      # Application ENV values such as SMTP, S3, etc. are NOT
      # validated here.
      # =========================================================

      - name: Validate required configuration
        run: |
          set -euo pipefail

          REQUIRED=(
            SSH_HOST
            SSH_USER
            SSH_PRIVATE_KEY
            CF_ACCESS_CLIENT_ID
            CF_ACCESS_CLIENT_SECRET
            TUNNEL_TARGET_PORT_NETWORK
            DATABASE_URI
            DOKPLOY_DEPLOY_URL
          )

          for NAME in "${REQUIRED[@]}"; do

            VALUE="${!NAME:-}"

            if [ -z "$VALUE" ]; then
              echo "ERROR: Required configuration is missing: $NAME"
              exit 1
            fi

          done

          echo "Required configuration valid."


      # =========================================================
      # INSTALL CLOUDFLARED
      # =========================================================

      - name: Install cloudflared
        run: |
          set -euo pipefail

          sudo curl \
            -fsSL \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          echo "cloudflared installed."


      # =========================================================
      # INSTALL SSH PRIVATE KEY
      # =========================================================

      - name: Install SSH private key
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          echo "SSH key installed."


      # =========================================================
      # CLOUDFLARE SERVICE TOKEN ENV
      #
      # cloudflared automatically reads these names.
      # =========================================================

      - name: Configure Cloudflare authentication
        run: |
          set -euo pipefail

          {
            echo "TUNNEL_SERVICE_TOKEN_ID=$CF_ACCESS_CLIENT_ID"
            echo "TUNNEL_SERVICE_TOKEN_SECRET=$CF_ACCESS_CLIENT_SECRET"
          } >> "$GITHUB_ENV"

          echo "Cloudflare authentication configured."


      # =========================================================
      # SSH CONFIG
      # =========================================================

      - name: Configure SSH
        run: |
          set -euo pipefail

          cat > "$HOME/.ssh/config" <<EOF
          Host production
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF

          chmod 600 "$HOME/.ssh/config"

          echo "SSH configured."


      # =========================================================
      # TEST VPS
      # =========================================================

      - name: Test VPS connection
        run: |
          set -euo pipefail

          ssh production '
            set -e

            test -x /usr/local/bin/docker-tunnel-helper
            docker info >/dev/null 2>&1
          '

          echo "VPS connection successful."


      # =========================================================
      # VALIDATE TUNNEL CONFIG
      #
      # Must be EXACTLY:
      #
      # target,port,network
      # =========================================================

      - name: Validate tunnel configuration
        id: tunnel-config
        run: |
          set -euo pipefail

          VALUE="$TUNNEL_TARGET_PORT_NETWORK"

          COMMA_COUNT="$(
            printf '%s' "$VALUE" |
            tr -cd ',' |
            wc -c
          )"

          if [ "$COMMA_COUNT" -ne 2 ]; then
            echo "ERROR: Tunnel configuration must contain exactly 3 values."
            echo "Expected format: target,port,network"
            exit 1
          fi

          IFS=',' read -r \
            DB_TARGET \
            DB_TARGET_PORT \
            DB_NETWORK \
            <<< "$VALUE"

          DB_TARGET="$(printf '%s' "$DB_TARGET" | xargs)"
          DB_TARGET_PORT="$(printf '%s' "$DB_TARGET_PORT" | xargs)"
          DB_NETWORK="$(printf '%s' "$DB_NETWORK" | xargs)"

          if [ -z "$DB_TARGET" ]; then
            echo "ERROR: Tunnel target is empty."
            exit 1
          fi

          if [ -z "$DB_TARGET_PORT" ]; then
            echo "ERROR: Tunnel port is empty."
            exit 1
          fi

          if [ -z "$DB_NETWORK" ]; then
            echo "ERROR: Tunnel network is empty."
            exit 1
          fi

          case "$DB_TARGET_PORT" in
            *[!0-9]*|'')
              echo "ERROR: Tunnel port must be numeric."
              exit 1
              ;;
          esac

          if [ "$DB_TARGET_PORT" -lt 1 ] || \
             [ "$DB_TARGET_PORT" -gt 65535 ]; then
            echo "ERROR: Tunnel port is outside the valid range."
            exit 1
          fi

          if ! [[ "$DB_TARGET" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: Invalid tunnel target."
            exit 1
          fi

          if ! [[ "$DB_NETWORK" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: Invalid tunnel network."
            exit 1
          fi

          echo "target=$DB_TARGET" >> "$GITHUB_OUTPUT"
          echo "port=$DB_TARGET_PORT" >> "$GITHUB_OUTPUT"
          echo "network=$DB_NETWORK" >> "$GITHUB_OUTPUT"

          echo "Tunnel configuration valid."


      # =========================================================
      # CREATE VPS DATABASE PROXY
      # =========================================================

      - name: Prepare database tunnel
        id: db
        env:
          DB_TARGET: ${{ steps.tunnel-config.outputs.target }}
          DB_TARGET_PORT: ${{ steps.tunnel-config.outputs.port }}
          DB_NETWORK: ${{ steps.tunnel-config.outputs.network }}
        run: |
          set -euo pipefail

          echo "Preparing database tunnel..."

          set +e

          RESULT="$(
            ssh production \
              "/usr/local/bin/docker-tunnel-helper prepare '$DB_TARGET' '$DB_TARGET_PORT' '$DB_NETWORK'" \
              2>&1
          )"

          EXIT_CODE=$?

          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "ERROR: Unable to prepare database tunnel."
            exit 1
          fi

          STATUS="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^STATUS=//p' |
            head -1
          )"

          SESSION_ID="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^SESSION_ID=//p' |
            head -1
          )"

          REMOTE_HOST="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^HOST=//p' |
            head -1
          )"

          REMOTE_PORT="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^PORT=//p' |
            head -1
          )"

          if [ "$STATUS" != "OK" ]; then
            echo "ERROR: Tunnel preparation failed."
            exit 1
          fi

          if [ -z "$SESSION_ID" ]; then
            echo "ERROR: Tunnel session was not returned."
            exit 1
          fi

          if [ -z "$REMOTE_HOST" ]; then
            echo "ERROR: Tunnel host was not returned."
            exit 1
          fi

          case "$REMOTE_PORT" in
            *[!0-9]*|'')
              echo "ERROR: Invalid tunnel response."
              exit 1
              ;;
          esac

          # Store session privately for cleanup.
          printf '%s\n' "$SESSION_ID" \
            > /tmp/db-tunnel-session

          chmod 600 /tmp/db-tunnel-session

          echo "remote_host=$REMOTE_HOST" >> "$GITHUB_OUTPUT"
          echo "remote_port=$REMOTE_PORT" >> "$GITHUB_OUTPUT"

          echo "Database tunnel prepared successfully."


      # =========================================================
      # OPEN GITHUB RUNNER -> VPS SSH FORWARD
      #
      # Bind to 0.0.0.0 so Docker can reach it through
      # host.docker.internal.
      # =========================================================

      - name: Open database SSH tunnel
        env:
          REMOTE_HOST: ${{ steps.db.outputs.remote_host }}
          REMOTE_PORT: ${{ steps.db.outputs.remote_port }}
        run: |
          set -euo pipefail

          if nc -z \
            127.0.0.1 \
            "$DB_LOCAL_PORT" \
            2>/dev/null
          then
            echo "ERROR: Local database port is already in use."
            exit 1
          fi

          ssh \
            -N \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -L "0.0.0.0:${DB_LOCAL_PORT}:${REMOTE_HOST}:${REMOTE_PORT}" \
            production \
            >/dev/null 2>&1 &

          SSH_PID=$!

          printf '%s\n' "$SSH_PID" \
            > /tmp/db-ssh-tunnel.pid

          chmod 600 /tmp/db-ssh-tunnel.pid

          READY=0

          for _ in $(seq 1 30); do

            if ! kill -0 "$SSH_PID" 2>/dev/null; then
              echo "ERROR: Database SSH tunnel exited unexpectedly."
              exit 1
            fi

            if nc \
              -z \
              -w 1 \
              127.0.0.1 \
              "$DB_LOCAL_PORT" \
              2>/dev/null
            then
              READY=1
              break
            fi

            sleep 0.5

          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Database connection did not become ready."
            exit 1
          fi

          echo "Database connection established successfully."


      # =========================================================
      # PREPARE DYNAMIC BUILD ENVIRONMENT
      #
      # EVERY value from secrets.ENV is automatically passed
      # into the Docker build.
      #
      # Only DATABASE_URI is modified:
      #
      # [DB_HOST] -> host.docker.internal
      # [DB_PORT] -> DB_LOCAL_PORT
      # =========================================================

      - name: Prepare build environment
        run: |
          set -euo pipefail

          DATABASE_URI_TEMPLATE="$DATABASE_URI"

          if [[ "$DATABASE_URI_TEMPLATE" != *"[DB_HOST]"* ]]; then
            echo "ERROR: DATABASE_URI is missing [DB_HOST]."
            exit 1
          fi

          if [[ "$DATABASE_URI_TEMPLATE" != *"[DB_PORT]"* ]]; then
            echo "ERROR: DATABASE_URI is missing [DB_PORT]."
            exit 1
          fi

          BUILD_DATABASE_URI="${DATABASE_URI_TEMPLATE//\[DB_HOST\]/host.docker.internal}"
          BUILD_DATABASE_URI="${BUILD_DATABASE_URI//\[DB_PORT\]/$DB_LOCAL_PORT}"

          if [[ "$BUILD_DATABASE_URI" == *"[DB_HOST]"* ]] || \
             [[ "$BUILD_DATABASE_URI" == *"[DB_PORT]"* ]]; then
            echo "ERROR: DATABASE_URI placeholders were not replaced."
            exit 1
          fi

          # Update only DATABASE_URI.
          # Every other ENV key remains unchanged.
          jq \
            --arg databaseUri "$BUILD_DATABASE_URI" \
            '.DATABASE_URI = $databaseUri' \
            /tmp/source-env.json \
            > /tmp/build-env.json

          chmod 600 /tmp/build-env.json

          echo "Build environment prepared successfully."


      # =========================================================
      # TEST RUNNER -> DATABASE
      # =========================================================

      - name: Test database tunnel
        run: |
          set -euo pipefail

          if ! nc \
            -z \
            -w 5 \
            127.0.0.1 \
            "$DB_LOCAL_PORT"
          then
            echo "ERROR: Database tunnel is unavailable."
            exit 1
          fi

          echo "Database tunnel test successful."


      # =========================================================
      # TEST DOCKER -> HOST -> DATABASE
      # =========================================================

      - name: Test Docker database access
        run: |
          set -euo pipefail

          if ! docker run \
            --rm \
            --add-host host.docker.internal:host-gateway \
            alpine:3.22 \
            sh -c \
            "nc -z -w 5 host.docker.internal '$DB_LOCAL_PORT'" \
            >/dev/null 2>&1
          then
            echo "ERROR: Docker cannot reach database tunnel."
            exit 1
          fi

          echo "Docker database access successful."


      # =========================================================
      # GHCR LOGIN
      # =========================================================

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # =========================================================
      # IMAGE NAME
      # =========================================================

      - name: Prepare image name
        id: image
        run: |
          set -euo pipefail

          IMAGE="$REGISTRY/$IMAGE_NAME"

          IMAGE="$(
            printf '%s' "$IMAGE" |
            tr '[:upper:]' '[:lower:]'
          )"

          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"


      # =========================================================
      # BUILD IMAGE
      #
      # Dockerfile receives ONE BuildKit secret:
      #
      # BUILD_ENV
      #
      # containing the complete dynamic JSON environment.
      # =========================================================

      - name: Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail

          DOCKER_BUILDKIT=1 docker build \
            --add-host \
            host.docker.internal:host-gateway \
            --secret \
            id=BUILD_ENV,src=/tmp/build-env.json \
            --build-arg \
            CACHEBUST="${GITHUB_SHA}" \
            --label \
            "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label \
            "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -f Dockerfile \
            .


      # =========================================================
      # PUSH GHCR
      # =========================================================

      - name: Push Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail

          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"

          echo "Docker image published successfully."


      # =========================================================
      # DOKPLOY DEPLOYMENT
      # =========================================================

      - name: Deploy to Dokploy
        run: |
          set -euo pipefail

          echo "Triggering Dokploy deployment..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 30 \
            "$DOKPLOY_DEPLOY_URL" \
            >/dev/null

          echo "Dokploy deployment triggered successfully."


      # =========================================================
      # CLEANUP DATABASE TUNNEL
      #
      # ALWAYS RUN
      # =========================================================

      - name: Cleanup database tunnel
        if: always()
        run: |
          set +e

          echo "Cleaning up database connection..."

          # -----------------------------------------------------
          # Stop local SSH forward
          # -----------------------------------------------------

          if [ -f /tmp/db-ssh-tunnel.pid ]; then

            SSH_PID="$(
              cat /tmp/db-ssh-tunnel.pid
            )"

            if kill -0 "$SSH_PID" 2>/dev/null; then

              kill "$SSH_PID" 2>/dev/null

              for _ in $(seq 1 10); do

                if ! kill -0 "$SSH_PID" 2>/dev/null; then
                  break
                fi

                sleep 0.2

              done

              if kill -0 "$SSH_PID" 2>/dev/null; then
                kill -9 "$SSH_PID" 2>/dev/null
              fi

            fi

            rm -f /tmp/db-ssh-tunnel.pid

          fi


          # -----------------------------------------------------
          # Remove VPS temporary proxy
          # -----------------------------------------------------

          if [ -f /tmp/db-tunnel-session ]; then

            SESSION_ID="$(
              cat /tmp/db-tunnel-session
            )"

            if ssh production \
              "/usr/local/bin/docker-tunnel-helper cleanup '$SESSION_ID'" \
              >/dev/null 2>&1
            then
              echo "Remote database tunnel cleaned up."
            else
              echo "WARNING: Remote database tunnel cleanup failed."
            fi

            rm -f /tmp/db-tunnel-session

          fi


          # -----------------------------------------------------
          # Remove temporary environment files
          # -----------------------------------------------------

          rm -f /tmp/source-env.json
          rm -f /tmp/build-env.json

          echo "Database cleanup complete."


      # =========================================================
      # CLEANUP SSH
      #
      # MUST REMAIN LAST
      # =========================================================

      - name: Cleanup SSH credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
          rm -f "$HOME/.ssh/config"

          echo "SSH credentials removed."