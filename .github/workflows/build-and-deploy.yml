name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DB_LOCAL_PORT: "27018"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Load environment
        env:
          ENV_JSON: ${{ secrets.ENV }}
        run: |
          set -euo pipefail

          [ -n "$ENV_JSON" ] || {
            echo "ERROR: ENV secret is missing."
            exit 1
          }

          printf '%s' "$ENV_JSON" |
            jq -e 'type == "object"' >/dev/null || {
              echo "ERROR: ENV must be a valid JSON object."
              exit 1
            }

          printf '%s' "$ENV_JSON" > /tmp/source-env.json
          chmod 600 /tmp/source-env.json

          echo "Environment loaded."

      - name: Validate required configuration
        run: |
          set -euo pipefail

          REQUIRED=(
            SSH_HOST
            SSH_USER
            SSH_PRIVATE_KEY
            CF_ACCESS_CLIENT_ID
            CF_ACCESS_CLIENT_SECRET
            TUNNEL_TARGET_PORT_NETWORK
            DATABASE_URI
            DOKPLOY_DEPLOY_URL
          )

          for KEY in "${REQUIRED[@]}"; do
            VALUE="$(jq -r --arg key "$KEY" '.[$key] // empty' /tmp/source-env.json)"

            if [ -z "$VALUE" ]; then
              echo "ERROR: Missing required configuration: $KEY"
              exit 1
            fi
          done

          echo "Required configuration valid."

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install cloudflared
        run: |
          set -euo pipefail

          sudo curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          echo "cloudflared installed."

      - name: Configure SSH
        run: |
          set -euo pipefail

          SSH_HOST="$(jq -r '.SSH_HOST' /tmp/source-env.json)"
          SSH_USER="$(jq -r '.SSH_USER' /tmp/source-env.json)"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          jq -r '.SSH_PRIVATE_KEY' /tmp/source-env.json \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          cat > "$HOME/.ssh/config" <<EOF
          Host production
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF

          chmod 600 "$HOME/.ssh/config"

          echo "SSH configured."

      - name: Test VPS connection
        run: |
          set -euo pipefail

          export TUNNEL_SERVICE_TOKEN_ID="$(
            jq -r '.CF_ACCESS_CLIENT_ID' /tmp/source-env.json
          )"

          export TUNNEL_SERVICE_TOKEN_SECRET="$(
            jq -r '.CF_ACCESS_CLIENT_SECRET' /tmp/source-env.json
          )"

          ssh production '
            set -e
            test -x /usr/local/bin/docker-tunnel-helper
            docker info >/dev/null 2>&1
          '

          echo "VPS connection successful."

      - name: Validate tunnel configuration
        id: tunnel
        run: |
          set -euo pipefail

          VALUE="$(
            jq -r '.TUNNEL_TARGET_PORT_NETWORK' /tmp/source-env.json
          )"

          COMMA_COUNT="$(
            printf '%s' "$VALUE" |
            tr -cd ',' |
            wc -c
          )"

          [ "$COMMA_COUNT" -eq 2 ] || {
            echo "ERROR: Tunnel configuration must be target,port,network"
            exit 1
          }

          IFS=',' read -r TARGET PORT NETWORK <<< "$VALUE"

          TARGET="$(printf '%s' "$TARGET" | xargs)"
          PORT="$(printf '%s' "$PORT" | xargs)"
          NETWORK="$(printf '%s' "$NETWORK" | xargs)"

          [ -n "$TARGET" ] || exit 1
          [ -n "$PORT" ] || exit 1
          [ -n "$NETWORK" ] || exit 1

          [[ "$PORT" =~ ^[0-9]+$ ]] || {
            echo "ERROR: Invalid tunnel port."
            exit 1
          }

          (( PORT >= 1 && PORT <= 65535 )) || {
            echo "ERROR: Invalid tunnel port."
            exit 1
          }

          [[ "$TARGET" =~ ^[A-Za-z0-9_.-]+$ ]] || exit 1
          [[ "$NETWORK" =~ ^[A-Za-z0-9_.-]+$ ]] || exit 1

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"

          echo "Tunnel configuration valid."

      - name: Prepare database tunnel
        id: db
        env:
          DB_TARGET: ${{ steps.tunnel.outputs.target }}
          DB_TARGET_PORT: ${{ steps.tunnel.outputs.port }}
          DB_NETWORK: ${{ steps.tunnel.outputs.network }}
        run: |
          set -euo pipefail

          export TUNNEL_SERVICE_TOKEN_ID="$(
            jq -r '.CF_ACCESS_CLIENT_ID' /tmp/source-env.json
          )"

          export TUNNEL_SERVICE_TOKEN_SECRET="$(
            jq -r '.CF_ACCESS_CLIENT_SECRET' /tmp/source-env.json
          )"

          set +e

          RESULT="$(
            ssh production \
              "/usr/local/bin/docker-tunnel-helper prepare '$DB_TARGET' '$DB_TARGET_PORT' '$DB_NETWORK'" \
              2>&1
          )"

          EXIT_CODE=$?

          set -e

          [ "$EXIT_CODE" -eq 0 ] || {
            echo "ERROR: Unable to prepare database tunnel."
            exit 1
          }

          STATUS="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^STATUS=//p' |
            head -1
          )"

          SESSION_ID="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^SESSION_ID=//p' |
            head -1
          )"

          REMOTE_HOST="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^HOST=//p' |
            head -1
          )"

          REMOTE_PORT="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^PORT=//p' |
            head -1
          )"

          [ "$STATUS" = "OK" ] || exit 1
          [ -n "$SESSION_ID" ] || exit 1
          [ -n "$REMOTE_HOST" ] || exit 1
          [[ "$REMOTE_PORT" =~ ^[0-9]+$ ]] || exit 1

          printf '%s\n' "$SESSION_ID" > /tmp/db-tunnel-session
          chmod 600 /tmp/db-tunnel-session

          echo "remote_host=$REMOTE_HOST" >> "$GITHUB_OUTPUT"
          echo "remote_port=$REMOTE_PORT" >> "$GITHUB_OUTPUT"

          echo "Database proxy prepared."

      - name: Open database SSH tunnel
        env:
          REMOTE_HOST: ${{ steps.db.outputs.remote_host }}
          REMOTE_PORT: ${{ steps.db.outputs.remote_port }}
        run: |
          set -euo pipefail

          export TUNNEL_SERVICE_TOKEN_ID="$(
            jq -r '.CF_ACCESS_CLIENT_ID' /tmp/source-env.json
          )"

          export TUNNEL_SERVICE_TOKEN_SECRET="$(
            jq -r '.CF_ACCESS_CLIENT_SECRET' /tmp/source-env.json
          )"

          ssh \
            -N \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -L "0.0.0.0:${DB_LOCAL_PORT}:${REMOTE_HOST}:${REMOTE_PORT}" \
            production \
            >/dev/null 2>&1 &

          SSH_PID=$!

          printf '%s\n' "$SSH_PID" > /tmp/db-ssh-tunnel.pid
          chmod 600 /tmp/db-ssh-tunnel.pid

          READY=0

          for _ in $(seq 1 30); do
            kill -0 "$SSH_PID" 2>/dev/null || {
              echo "ERROR: SSH tunnel exited."
              exit 1
            }

            if nc -z -w 1 127.0.0.1 "$DB_LOCAL_PORT" 2>/dev/null; then
              READY=1
              break
            fi

            sleep 0.5
          done

          [ "$READY" -eq 1 ] || {
            echo "ERROR: Database tunnel unavailable."
            exit 1
          }

          echo "Database tunnel established."

      - name: Prepare build environment
        run: |
          set -euo pipefail

          DATABASE_URI="$(
            jq -r '.DATABASE_URI' /tmp/source-env.json
          )"

          [[ "$DATABASE_URI" == *"[DB_HOST]"* ]] || {
            echo "ERROR: DATABASE_URI missing [DB_HOST]."
            exit 1
          }

          [[ "$DATABASE_URI" == *"[DB_PORT]"* ]] || {
            echo "ERROR: DATABASE_URI missing [DB_PORT]."
            exit 1
          }

          BUILD_DATABASE_URI="${DATABASE_URI//\[DB_HOST\]/host.docker.internal}"
          BUILD_DATABASE_URI="${BUILD_DATABASE_URI//\[DB_PORT\]/$DB_LOCAL_PORT}"

          jq \
            --arg databaseUri "$BUILD_DATABASE_URI" \
            '
              del(
                .SSH_HOST,
                .SSH_USER,
                .SSH_PRIVATE_KEY,
                .CF_ACCESS_CLIENT_ID,
                .CF_ACCESS_CLIENT_SECRET,
                .TUNNEL_TARGET_PORT_NETWORK,
                .DOKPLOY_DEPLOY_URL
              )
              |
              .DATABASE_URI = $databaseUri
            ' \
            /tmp/source-env.json \
            > /tmp/build-env.json

          chmod 600 /tmp/build-env.json

          echo "Build environment prepared."

      - name: Verify build database configuration
        run: |
          set -euo pipefail

          URI="$(
            jq -r '.DATABASE_URI' /tmp/build-env.json
          )"

          HOST="$(
            printf '%s' "$URI" |
            sed -E 's#^[^@]*@([^:/?]+).*#\1#'
          )"

          PORT="$(
            printf '%s' "$URI" |
            sed -E 's#^[^@]*@[^:]+:([0-9]+).*#\1#'
          )"

          [ "$HOST" = "host.docker.internal" ] || {
            echo "ERROR: Wrong build database host."
            exit 1
          }

          [ "$PORT" = "$DB_LOCAL_PORT" ] || {
            echo "ERROR: Wrong build database port."
            exit 1
          }

          echo "Build database configuration verified."

      - name: Test Docker database access
        run: |
          set -euo pipefail

          docker run \
            --rm \
            --add-host host.docker.internal:host-gateway \
            alpine:3.22 \
            sh -c "nc -z -w 5 host.docker.internal '$DB_LOCAL_PORT'" \
            >/dev/null 2>&1 || {
              echo "ERROR: Docker cannot reach database."
              exit 1
            }

          echo "Docker database access successful."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: |
          set -euo pipefail

          IMAGE="$REGISTRY/$IMAGE_NAME"
          IMAGE="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"

          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail

          DOCKER_BUILDKIT=1 docker build \
            --add-host host.docker.internal:host-gateway \
            --secret id=BUILD_ENV,src=/tmp/build-env.json \
            --build-arg CACHEBUST="${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -f Dockerfile \
            .

      - name: Push Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail

          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"

          echo "Image published."

      - name: Deploy to Dokploy
        run: |
          set -euo pipefail

          DOKPLOY_DEPLOY_URL="$(
            jq -r '.DOKPLOY_DEPLOY_URL' /tmp/source-env.json
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 30 \
            "$DOKPLOY_DEPLOY_URL" \
            >/dev/null

          echo "Dokploy deployment triggered."

      - name: Cleanup database tunnel
        if: always()
        run: |
          set +e

          export TUNNEL_SERVICE_TOKEN_ID="$(
            jq -r '.CF_ACCESS_CLIENT_ID // empty' /tmp/source-env.json 2>/dev/null
          )"

          export TUNNEL_SERVICE_TOKEN_SECRET="$(
            jq -r '.CF_ACCESS_CLIENT_SECRET // empty' /tmp/source-env.json 2>/dev/null
          )"

          if [ -f /tmp/db-ssh-tunnel.pid ]; then
            SSH_PID="$(cat /tmp/db-ssh-tunnel.pid)"

            kill "$SSH_PID" >/dev/null 2>&1 || true
            sleep 1
            kill -9 "$SSH_PID" >/dev/null 2>&1 || true

            rm -f /tmp/db-ssh-tunnel.pid
          fi

          if [ -f /tmp/db-tunnel-session ]; then
            SESSION_ID="$(cat /tmp/db-tunnel-session)"

            ssh production \
              "/usr/local/bin/docker-tunnel-helper cleanup '$SESSION_ID'" \
              >/dev/null 2>&1 || true

            rm -f /tmp/db-tunnel-session
          fi

          rm -f /tmp/build-env.json

          echo "Database cleanup complete."

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
          rm -f "$HOME/.ssh/config"
          rm -f /tmp/source-env.json

          echo "Credentials removed."