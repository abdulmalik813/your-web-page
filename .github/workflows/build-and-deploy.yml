name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: prod

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}

      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      TUNNEL_TARGET_PORT_NETWORK: ${{ secrets.TUNNEL_TARGET_PORT_NETWORK }}

      DB_LOCAL_PORT: "27018"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Load environment variables
        env:
          ENV_JSON: ${{ secrets.ENV }}
        run: |
          set -euo pipefail

          if [ -z "${ENV_JSON:-}" ]; then
            echo "ERROR: GitHub secret ENV is missing or empty."
            exit 1
          fi

          # Make sure the entire original JSON is masked too.
          MASKED_ENV_JSON="${ENV_JSON//'%'/'%25'}"
          MASKED_ENV_JSON="${MASKED_ENV_JSON//$'\r'/'%0D'}"
          MASKED_ENV_JSON="${MASKED_ENV_JSON//$'\n'/'%0A'}"
          echo "::add-mask::$MASKED_ENV_JSON"

          # Validate JSON without printing its contents.
          if ! jq -e 'type == "object"' \
            >/dev/null 2>&1 <<< "$ENV_JSON"
          then
            echo "ERROR: ENV must contain a valid JSON object."
            exit 1
          fi

          REQUIRED_ENV_VARS=(
            NODE_ENV
            DATABASE_URI
            CRON_SECRET
            NEXT_PUBLIC_SERVER_URL
            PAYLOAD_SECRET
            PREVIEW_SECRET
            RESEND_API_KEY
            S3_ACCESS_KEY_ID
            S3_SECRET_ACCESS_KEY
            S3_BUCKET
            S3_ENDPOINT
            S3_REGION
            TAILWIND_GENERATOR
            USE_RESEND
            IMAGE_HOSTS
            EMAIL_FROM_ADDRESS
            EMAIL_FROM_NAME
            SMTP_HOST
            SMTP_PORT
            SMTP_USER
            SMTP_PASS
            SMTP_SECURE
          )

          for KEY in "${REQUIRED_ENV_VARS[@]}"; do

            # Verify the key exists.
            if ! jq -e \
              --arg key "$KEY" \
              'has($key) and .[$key] != null' \
              >/dev/null 2>&1 <<< "$ENV_JSON"
            then
              echo "ERROR: Required variable $KEY is missing from ENV."
              exit 1
            fi

            # Read the value without printing it.
            VALUE="$(
              jq -r \
                --arg key "$KEY" \
                '
                  .[$key]
                  | if type == "string"
                    then .
                    else tostring
                    end
                ' <<< "$ENV_JSON"
            )"

            # Explicitly mask each parsed value.
            #
            # Escape characters used by GitHub workflow commands.
            MASKED_VALUE="${VALUE//'%'/'%25'}"
            MASKED_VALUE="${MASKED_VALUE//$'\r'/'%0D'}"
            MASKED_VALUE="${MASKED_VALUE//$'\n'/'%0A'}"

            if [ -n "$MASKED_VALUE" ]; then
              echo "::add-mask::$MASKED_VALUE"
            fi

            # Use a random delimiter so multiline values are safe.
            DELIMITER="ENV_$(openssl rand -hex 16)"

            while grep -Fqx "$DELIMITER" <<< "$VALUE"; do
              DELIMITER="ENV_$(openssl rand -hex 16)"
            done

            {
              echo "${KEY}<<${DELIMITER}"
              printf '%s\n' "$VALUE"
              echo "${DELIMITER}"
            } >> "$GITHUB_ENV"

            unset VALUE
            unset MASKED_VALUE
            unset DELIMITER
          done

          unset ENV_JSON
          unset MASKED_ENV_JSON

          echo "Application environment loaded successfully."

      - name: Install cloudflared
        run: |
          set -euo pipefail

          sudo curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          echo "cloudflared installed."

      - name: Install SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          echo "SSH key installed."

      - name: Configure SSH
        run: |
          set -euo pipefail

          cat > "$HOME/.ssh/config" <<EOF
          Host production
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF

          chmod 600 "$HOME/.ssh/config"

      - name: Validate configuration
        run: |
          set -euo pipefail

          test -n "$SSH_HOST" || {
            echo "ERROR: SSH_HOST is missing."
            exit 1
          }

          test -n "$SSH_USER" || {
            echo "ERROR: SSH_USER is missing."
            exit 1
          }

          test -n "$TUNNEL_SERVICE_TOKEN_ID" || {
            echo "ERROR: CF_ACCESS_CLIENT_ID is missing."
            exit 1
          }

          test -n "$TUNNEL_SERVICE_TOKEN_SECRET" || {
            echo "ERROR: CF_ACCESS_CLIENT_SECRET is missing."
            exit 1
          }

          test -n "$TUNNEL_TARGET_PORT_NETWORK" || {
            echo "ERROR: TUNNEL_TARGET_PORT_NETWORK is missing."
            exit 1
          }

          test -n "$DATABASE_URI" || {
            echo "ERROR: DATABASE_URI is missing from ENV."
            exit 1
          }

          test -s "$HOME/.ssh/id_ed25519" || {
            echo "ERROR: SSH_PRIVATE_KEY is missing."
            exit 1
          }

          echo "Configuration valid."

      - name: Validate tunnel configuration
        id: tunnel-config
        run: |
          set -euo pipefail

          VALUE="$TUNNEL_TARGET_PORT_NETWORK"

          COMMA_COUNT="$(
            printf '%s' "$VALUE" |
            tr -cd ',' |
            wc -c
          )"

          if [ "$COMMA_COUNT" -ne 2 ]; then
            echo "ERROR: Tunnel configuration must contain exactly 3 values."
            echo "Expected format: target,port,network"
            exit 1
          fi

          IFS=',' read -r DB_TARGET DB_TARGET_PORT DB_NETWORK <<< "$VALUE"

          DB_TARGET="$(printf '%s' "$DB_TARGET" | xargs)"
          DB_TARGET_PORT="$(printf '%s' "$DB_TARGET_PORT" | xargs)"
          DB_NETWORK="$(printf '%s' "$DB_NETWORK" | xargs)"

          [ -n "$DB_TARGET" ] || {
            echo "ERROR: Tunnel target is empty."
            exit 1
          }

          [ -n "$DB_TARGET_PORT" ] || {
            echo "ERROR: Tunnel port is empty."
            exit 1
          }

          [ -n "$DB_NETWORK" ] || {
            echo "ERROR: Tunnel network is empty."
            exit 1
          }

          case "$DB_TARGET_PORT" in
            *[!0-9]*|'')
              echo "ERROR: Tunnel port must be numeric."
              exit 1
              ;;
          esac

          if [ "$DB_TARGET_PORT" -lt 1 ] || \
             [ "$DB_TARGET_PORT" -gt 65535 ]; then
            echo "ERROR: Tunnel port is outside the valid range."
            exit 1
          fi

          if ! [[ "$DB_TARGET" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: Invalid tunnel target."
            exit 1
          fi

          if ! [[ "$DB_NETWORK" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: Invalid tunnel network."
            exit 1
          fi

          echo "target=$DB_TARGET" >> "$GITHUB_OUTPUT"
          echo "port=$DB_TARGET_PORT" >> "$GITHUB_OUTPUT"
          echo "network=$DB_NETWORK" >> "$GITHUB_OUTPUT"

          echo "Tunnel configuration valid."

      - name: Prepare database tunnel
        id: db
        env:
          DB_TARGET: ${{ steps.tunnel-config.outputs.target }}
          DB_TARGET_PORT: ${{ steps.tunnel-config.outputs.port }}
          DB_NETWORK: ${{ steps.tunnel-config.outputs.network }}
        run: |
          set -euo pipefail

          echo "Preparing database tunnel..."

          set +e

          RESULT="$(
            ssh production \
              "/usr/local/bin/docker-tunnel-helper prepare '$DB_TARGET' '$DB_TARGET_PORT' '$DB_NETWORK'" \
              2>&1
          )"

          EXIT_CODE=$?

          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "ERROR: Unable to prepare database tunnel."
            exit 1
          fi

          STATUS="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^STATUS=//p' |
            head -1
          )"

          SESSION_ID="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^SESSION_ID=//p' |
            head -1
          )"

          REMOTE_HOST="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^HOST=//p' |
            head -1
          )"

          REMOTE_PORT="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^PORT=//p' |
            head -1
          )"

          [ "$STATUS" = "OK" ] || {
            echo "ERROR: Tunnel preparation failed."
            exit 1
          }

          [ -n "$SESSION_ID" ] || {
            echo "ERROR: Tunnel session was not returned."
            exit 1
          }

          [ -n "$REMOTE_HOST" ] || {
            echo "ERROR: Tunnel host was not returned."
            exit 1
          }

          case "$REMOTE_PORT" in
            *[!0-9]*|'')
              echo "ERROR: Invalid tunnel response."
              exit 1
              ;;
          esac

          printf '%s\n' "$SESSION_ID" \
            > /tmp/db-tunnel-session

          echo "remote_host=$REMOTE_HOST" >> "$GITHUB_OUTPUT"
          echo "remote_port=$REMOTE_PORT" >> "$GITHUB_OUTPUT"

          echo "Database tunnel prepared successfully."

      - name: Open database SSH tunnel
        env:
          REMOTE_HOST: ${{ steps.db.outputs.remote_host }}
          REMOTE_PORT: ${{ steps.db.outputs.remote_port }}
        run: |
          set -euo pipefail

          if nc -z 127.0.0.1 "$DB_LOCAL_PORT" 2>/dev/null; then
            echo "ERROR: Local database port is already in use."
            exit 1
          fi

          ssh \
            -N \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -L "0.0.0.0:${DB_LOCAL_PORT}:${REMOTE_HOST}:${REMOTE_PORT}" \
            production \
            >/dev/null 2>&1 &

          SSH_PID=$!

          printf '%s\n' "$SSH_PID" \
            > /tmp/db-ssh-tunnel.pid

          READY=0

          for _ in $(seq 1 30); do

            if ! kill -0 "$SSH_PID" 2>/dev/null; then
              echo "ERROR: Database tunnel exited unexpectedly."
              exit 1
            fi

            if nc -z -w 1 127.0.0.1 "$DB_LOCAL_PORT" 2>/dev/null; then
              READY=1
              break
            fi

            sleep 0.5
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Database connection did not become ready."
            exit 1
          fi

          echo "Database connection established successfully."

      - name: Configure database URI
        run: |
          set -euo pipefail

          if [[ "$DATABASE_URI" != *"[DB_HOST]"* ]]; then
            echo "ERROR: DATABASE_URI is missing [DB_HOST]."
            exit 1
          fi

          if [[ "$DATABASE_URI" != *"[DB_PORT]"* ]]; then
            echo "ERROR: DATABASE_URI is missing [DB_PORT]."
            exit 1
          fi

          RESOLVED_DATABASE_URI="${DATABASE_URI//\[DB_HOST\]/host.docker.internal}"
          RESOLVED_DATABASE_URI="${RESOLVED_DATABASE_URI//\[DB_PORT\]/$DB_LOCAL_PORT}"

          if [[ "$RESOLVED_DATABASE_URI" == *"[DB_HOST]"* ]] || \
             [[ "$RESOLVED_DATABASE_URI" == *"[DB_PORT]"* ]]; then
            echo "ERROR: Database URI placeholders were not replaced."
            exit 1
          fi

          MASKED_DATABASE_URI="${RESOLVED_DATABASE_URI//'%'/'%25'}"
          MASKED_DATABASE_URI="${MASKED_DATABASE_URI//$'\r'/'%0D'}"
          MASKED_DATABASE_URI="${MASKED_DATABASE_URI//$'\n'/'%0A'}"

          echo "::add-mask::$MASKED_DATABASE_URI"

          DELIMITER="DATABASE_URI_$(openssl rand -hex 16)"

          while grep -Fqx "$DELIMITER" <<< "$RESOLVED_DATABASE_URI"; do
            DELIMITER="DATABASE_URI_$(openssl rand -hex 16)"
          done

          {
            echo "DATABASE_URI<<${DELIMITER}"
            printf '%s\n' "$RESOLVED_DATABASE_URI"
            echo "${DELIMITER}"
          } >> "$GITHUB_ENV"

          unset RESOLVED_DATABASE_URI
          unset MASKED_DATABASE_URI
          unset DELIMITER

          echo "Database URI configured successfully."

      - name: Test Docker database access
        run: |
          set -euo pipefail

          docker run \
            --rm \
            --add-host host.docker.internal:host-gateway \
            alpine:3.22 \
            sh -c \
            "nc -z -w 5 host.docker.internal '$DB_LOCAL_PORT'" \
            >/dev/null 2>&1

          echo "Docker database access successful."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: |
          set -euo pipefail

          IMAGE="$REGISTRY/$IMAGE_NAME"

          IMAGE="$(
            printf '%s' "$IMAGE" |
            tr '[:upper:]' '[:lower:]'
          )"

          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile

          push: true

          add-hosts: |
            host.docker.internal=host-gateway

          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          secret-envs: |
            NODE_ENV=NODE_ENV
            DATABASE_URI=DATABASE_URI
            CRON_SECRET=CRON_SECRET
            NEXT_PUBLIC_SERVER_URL=NEXT_PUBLIC_SERVER_URL
            PAYLOAD_SECRET=PAYLOAD_SECRET
            PREVIEW_SECRET=PREVIEW_SECRET
            RESEND_API_KEY=RESEND_API_KEY
            S3_ACCESS_KEY_ID=S3_ACCESS_KEY_ID
            S3_SECRET_ACCESS_KEY=S3_SECRET_ACCESS_KEY
            S3_BUCKET=S3_BUCKET
            S3_ENDPOINT=S3_ENDPOINT
            S3_REGION=S3_REGION
            TAILWIND_GENERATOR=TAILWIND_GENERATOR
            USE_RESEND=USE_RESEND
            IMAGE_HOSTS=IMAGE_HOSTS
            EMAIL_FROM_ADDRESS=EMAIL_FROM_ADDRESS
            EMAIL_FROM_NAME=EMAIL_FROM_NAME
            SMTP_HOST=SMTP_HOST
            SMTP_PORT=SMTP_PORT
            SMTP_USER=SMTP_USER
            SMTP_PASS=SMTP_PASS
            SMTP_SECURE=SMTP_SECURE

      - name: Deploy to Dokploy
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
        run: |
          set -euo pipefail

          echo "Triggering Dokploy deployment..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 30 \
            "$DOKPLOY_DEPLOY_URL"

          echo
          echo "Dokploy deployment triggered successfully."

      - name: Cleanup database tunnel
        if: always()
        run: |
          set +e

          echo "Cleaning up database connection..."

          if [ -f /tmp/db-ssh-tunnel.pid ]; then

            SSH_PID="$(cat /tmp/db-ssh-tunnel.pid)"

            if kill -0 "$SSH_PID" 2>/dev/null; then

              kill "$SSH_PID" 2>/dev/null

              for _ in $(seq 1 10); do

                if ! kill -0 "$SSH_PID" 2>/dev/null; then
                  break
                fi

                sleep 0.2
              done

              if kill -0 "$SSH_PID" 2>/dev/null; then
                kill -9 "$SSH_PID" 2>/dev/null
              fi

            fi

            rm -f /tmp/db-ssh-tunnel.pid
          fi

          if [ -f /tmp/db-tunnel-session ]; then

            SESSION_ID="$(cat /tmp/db-tunnel-session)"

            if ssh production \
              "/usr/local/bin/docker-tunnel-helper cleanup '$SESSION_ID'" \
              >/dev/null 2>&1
            then
              echo "Remote database tunnel cleaned up."
            else
              echo "WARNING: Remote database tunnel cleanup failed."
            fi

            rm -f /tmp/db-tunnel-session
          fi

          echo "Database cleanup complete."

      - name: Cleanup SSH credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
          rm -f "$HOME/.ssh/config"

          echo "SSH credentials removed."