name: Build and Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-vps:
    name: Test VPS Access
    runs-on: ubuntu-latest

    environment: prod

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared

          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Install SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Start Cloudflare TCP tunnel
        run: |
          cloudflared access tcp \
            --hostname "${SSH_HOST}" \
            --url 127.0.0.1:2222 \
            --service-token-id "${CF_ACCESS_CLIENT_ID}" \
            --service-token-secret "${CF_ACCESS_CLIENT_SECRET}" \
            > /tmp/cloudflared.log 2>&1 &

          echo $! > /tmp/cloudflared.pid

          sleep 5

          cat /tmp/cloudflared.log

          if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
            echo "cloudflared exited unexpectedly"
            exit 1
          fi

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -p 2222 \
            "${SSH_USER}@127.0.0.1" '
              echo "======================================"
              echo " GitHub Actions SSH connection SUCCESS"
              echo "======================================"
              echo
              echo "Hostname: $(hostname)"
              echo "User:     $(whoami)"
              echo "Kernel:   $(uname -r)"
              echo
              echo "Docker:"
              docker --version
            '

      - name: Show cloudflared log on failure
        if: failure()
        run: |
          cat /tmp/cloudflared.log || true

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/cloudflared.pid ]; then
            kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
          fi

          rm -f ~/.ssh/id_ed25519
          rm -f /tmp/cloudflared.pid
          rm -f /tmp/cloudflared.log