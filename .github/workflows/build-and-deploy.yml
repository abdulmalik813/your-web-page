name: Build and Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-vps:
    name: Test VPS Access
    runs-on: ubuntu-latest

    environment: prod

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}

      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared

          chmod +x /usr/local/bin/cloudflared

          cloudflared --version

      - name: Test Cloudflare Service Token
        run: |
          STATUS=$(curl -sS \
            -o /tmp/cf-response \
            -w "%{http_code}" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "https://${SSH_HOST}/")

          echo "Cloudflare HTTP status: ${STATUS}"

          echo
          echo "Cloudflare response:"
          head -c 1000 /tmp/cf-response || true
          echo

      - name: Install SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Configure SSH
        run: |
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id '${CF_ACCESS_CLIENT_ID}' --service-token-secret '${CF_ACCESS_CLIENT_SECRET}'
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF

          chmod 600 ~/.ssh/config

      - name: Test Cloudflare SSH connection
        run: |
          ssh production '
            echo "======================================"
            echo " GitHub Actions SSH connection SUCCESS"
            echo "======================================"
            echo
            echo "Hostname: $(hostname)"
            echo "User:     $(whoami)"
            echo "Kernel:   $(uname -r)"
            echo
            echo "Docker:"
            docker --version
          '

      - name: Cleanup SSH credentials
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519
          rm -f ~/.ssh/config
          rm -f /tmp/cf-response