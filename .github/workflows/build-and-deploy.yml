name: Build and Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: prod

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}

      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      # =========================================================
      # PREPARE CLOUDFLARE
      # =========================================================

      - name: Install cloudflared
        run: |
          sudo curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          cloudflared --version


      # =========================================================
      # PREPARE SSH KEY
      # =========================================================

      - name: Install SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          echo "SSH key installed."


      # =========================================================
      # CONFIGURE SSH THROUGH CLOUDFLARE
      # =========================================================

      - name: Configure SSH
        run: |
          cat > "$HOME/.ssh/config" <<EOF
          Host production
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF

          chmod 600 "$HOME/.ssh/config"


      # =========================================================
      # VALIDATE SECRETS
      # =========================================================

      - name: Validate connection configuration
        run: |
          test -n "$SSH_HOST" || {
            echo "SSH_HOST missing"
            exit 1
          }

          test -n "$SSH_USER" || {
            echo "SSH_USER missing"
            exit 1
          }

          test -n "$TUNNEL_SERVICE_TOKEN_ID" || {
            echo "CF_ACCESS_CLIENT_ID missing"
            exit 1
          }

          test -n "$TUNNEL_SERVICE_TOKEN_SECRET" || {
            echo "CF_ACCESS_CLIENT_SECRET missing"
            exit 1
          }

          test -s "$HOME/.ssh/id_ed25519" || {
            echo "SSH_PRIVATE_KEY missing"
            exit 1
          }

          echo "Connection configuration OK."


      # =========================================================
      # TEST SSH
      # =========================================================

      - name: Test Cloudflare SSH connection
        run: |
          ssh production '
            set -e

            echo "======================================"
            echo " GitHub Actions SSH SUCCESS"
            echo "======================================"
            echo

            echo "Hostname: $(hostname)"
            echo "User:     $(whoami)"
            echo "Kernel:   $(uname -r)"

            echo
            echo "Docker:"
            docker --version
          '


      # =========================================================
      # PREPARE DATABASE TUNNEL
      # =========================================================

      - name: Prepare database tunnel
        id: db-tunnel
        run: |
          echo "======================================"
          echo " DATABASE TUNNEL"
          echo "======================================"
          echo

          # TODO:
