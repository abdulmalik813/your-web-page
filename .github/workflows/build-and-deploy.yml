name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: prod

    env:
      # =========================================================
      # SSH / CLOUDFLARE
      # =========================================================

      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}

      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # =========================================================
      # DATABASE TUNNEL
      #
      # Required format:
      # target,port,network
      # =========================================================

      TUNNEL_TARGET_PORT_NETWORK: ${{ secrets.TUNNEL_TARGET_PORT_NETWORK }}

      DB_LOCAL_PORT: "27018"

      # =========================================================
      # DATABASE URI TEMPLATE
      #
      # Must contain:
      # [DB_HOST]
      # [DB_PORT]
      # =========================================================

      DATABASE_URI_TEMPLATE: ${{ secrets.DATABASE_URI }}

      # =========================================================
      # BUILD ENVIRONMENT
      #
      # These are optional from the workflow's perspective.
      # =========================================================

      NODE_ENV: ${{ secrets.NODE_ENV }}

      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}

      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}

      TAILWIND_GENERATOR: ${{ secrets.TAILWIND_GENERATOR }}
      USE_RESEND: ${{ secrets.USE_RESEND }}

      IMAGE_HOSTS: ${{ secrets.IMAGE_HOSTS }}

      EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
      EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # =========================================================
      # INSTALL CLOUDFLARED
      # =========================================================

      - name: Install cloudflared
        run: |
          set -euo pipefail

          sudo curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          echo "cloudflared installed."


      # =========================================================
      # SSH PRIVATE KEY
      # =========================================================

      - name: Install SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          echo "SSH key installed."


      # =========================================================
      # SSH CONFIG
      # =========================================================

      - name: Configure SSH
        run: |
          set -euo pipefail

          cat > "$HOME/.ssh/config" <<EOF
          Host production
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF

          chmod 600 "$HOME/.ssh/config"


      # =========================================================
      # VALIDATE REQUIRED CONFIG
      # =========================================================

      - name: Validate configuration
        run: |
          set -euo pipefail

          test -n "$SSH_HOST" || {
            echo "ERROR: SSH_HOST is missing."
            exit 1
          }

          test -n "$SSH_USER" || {
            echo "ERROR: SSH_USER is missing."
            exit 1
          }

          test -n "$TUNNEL_SERVICE_TOKEN_ID" || {
            echo "ERROR: CF_ACCESS_CLIENT_ID is missing."
            exit 1
          }

          test -n "$TUNNEL_SERVICE_TOKEN_SECRET" || {
            echo "ERROR: CF_ACCESS_CLIENT_SECRET is missing."
            exit 1
          }

          test -n "$TUNNEL_TARGET_PORT_NETWORK" || {
            echo "ERROR: TUNNEL_TARGET_PORT_NETWORK is missing."
            exit 1
          }

          test -n "$DATABASE_URI_TEMPLATE" || {
            echo "ERROR: DATABASE_URI is missing."
            exit 1
          }

          test -s "$HOME/.ssh/id_ed25519" || {
            echo "ERROR: SSH_PRIVATE_KEY is missing."
            exit 1
          }

          echo "Configuration valid."


      # =========================================================
      # TEST VPS CONNECTION
      # =========================================================

      - name: Test VPS connection
        run: |
          set -euo pipefail

          ssh production '
            set -e

            test -x /usr/local/bin/docker-tunnel-helper
            docker info >/dev/null 2>&1
          '

          echo "VPS connection successful."


      # =========================================================
      # PARSE + VALIDATE TUNNEL CONFIGURATION
      #
      # EXACTLY:
      # target,port,network
      # =========================================================

      - name: Validate tunnel configuration
        id: tunnel-config
        run: |
          set -euo pipefail

          VALUE="$TUNNEL_TARGET_PORT_NETWORK"

          COMMA_COUNT="$(
            printf '%s' "$VALUE" |
            tr -cd ',' |
            wc -c
          )"

          if [ "$COMMA_COUNT" -ne 2 ]; then
            echo "ERROR: Tunnel configuration must contain exactly 3 values."
            echo "Expected format: target,port,network"
            exit 1
          fi

          IFS=',' read -r DB_TARGET DB_TARGET_PORT DB_NETWORK <<< "$VALUE"

          DB_TARGET="$(printf '%s' "$DB_TARGET" | xargs)"
          DB_TARGET_PORT="$(printf '%s' "$DB_TARGET_PORT" | xargs)"
          DB_NETWORK="$(printf '%s' "$DB_NETWORK" | xargs)"

          [ -n "$DB_TARGET" ] || {
            echo "ERROR: Tunnel target is empty."
            exit 1
          }

          [ -n "$DB_TARGET_PORT" ] || {
            echo "ERROR: Tunnel port is empty."
            exit 1
          }

          [ -n "$DB_NETWORK" ] || {
            echo "ERROR: Tunnel network is empty."
            exit 1
          }

          case "$DB_TARGET_PORT" in
            *[!0-9]*|'')
              echo "ERROR: Tunnel port must be numeric."
              exit 1
              ;;
          esac

          if [ "$DB_TARGET_PORT" -lt 1 ] || \
             [ "$DB_TARGET_PORT" -gt 65535 ]; then
            echo "ERROR: Tunnel port is outside the valid range."
            exit 1
          fi

          if ! [[ "$DB_TARGET" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: Invalid tunnel target."
            exit 1
          fi

          if ! [[ "$DB_NETWORK" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: Invalid tunnel network."
            exit 1
          fi

          echo "target=$DB_TARGET" >> "$GITHUB_OUTPUT"
          echo "port=$DB_TARGET_PORT" >> "$GITHUB_OUTPUT"
          echo "network=$DB_NETWORK" >> "$GITHUB_OUTPUT"

          echo "Tunnel configuration valid."


      # =========================================================
      # CREATE TEMPORARY VPS DATABASE PROXY
      # =========================================================

      - name: Prepare database tunnel
        id: db
        env:
          DB_TARGET: ${{ steps.tunnel-config.outputs.target }}
          DB_TARGET_PORT: ${{ steps.tunnel-config.outputs.port }}
          DB_NETWORK: ${{ steps.tunnel-config.outputs.network }}
        run: |
          set -euo pipefail

          echo "Preparing database tunnel..."

          set +e

          RESULT="$(
            ssh production \
              "/usr/local/bin/docker-tunnel-helper prepare '$DB_TARGET' '$DB_TARGET_PORT' '$DB_NETWORK'" \
              2>&1
          )"

          EXIT_CODE=$?

          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "ERROR: Unable to prepare database tunnel."
            exit 1
          fi

          STATUS="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^STATUS=//p' |
            head -1
          )"

          SESSION_ID="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^SESSION_ID=//p' |
            head -1
          )"

          REMOTE_HOST="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^HOST=//p' |
            head -1
          )"

          REMOTE_PORT="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^PORT=//p' |
            head -1
          )"

          [ "$STATUS" = "OK" ] || {
            echo "ERROR: Tunnel preparation failed."
            exit 1
          }

          [ -n "$SESSION_ID" ] || {
            echo "ERROR: Tunnel session was not returned."
            exit 1
          }

          [ -n "$REMOTE_HOST" ] || {
            echo "ERROR: Tunnel host was not returned."
            exit 1
          }

          case "$REMOTE_PORT" in
            *[!0-9]*|'')
              echo "ERROR: Invalid tunnel response."
              exit 1
              ;;
          esac

          printf '%s\n' "$SESSION_ID" \
            > /tmp/db-tunnel-session

          echo "remote_host=$REMOTE_HOST" >> "$GITHUB_OUTPUT"
          echo "remote_port=$REMOTE_PORT" >> "$GITHUB_OUTPUT"

          echo "Database tunnel prepared successfully."


      # =========================================================
      # OPEN GITHUB RUNNER -> VPS SSH FORWARD
      #
      # Bind on 0.0.0.0 so Docker host-gateway can access it.
      # =========================================================

      - name: Open database SSH tunnel
        env:
          REMOTE_HOST: ${{ steps.db.outputs.remote_host }}
          REMOTE_PORT: ${{ steps.db.outputs.remote_port }}
        run: |
          set -euo pipefail

          if nc -z 127.0.0.1 "$DB_LOCAL_PORT" 2>/dev/null; then
            echo "ERROR: Local database port is already in use."
            exit 1
          fi

          ssh \
            -N \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -L "0.0.0.0:${DB_LOCAL_PORT}:${REMOTE_HOST}:${REMOTE_PORT}" \
            production \
            >/dev/null 2>&1 &

          SSH_PID=$!

          printf '%s\n' "$SSH_PID" \
            > /tmp/db-ssh-tunnel.pid

          READY=0

          for _ in $(seq 1 30); do

            if ! kill -0 "$SSH_PID" 2>/dev/null; then
              echo "ERROR: Database tunnel exited unexpectedly."
              exit 1
            fi

            if nc -z -w 1 127.0.0.1 "$DB_LOCAL_PORT" 2>/dev/null; then
              READY=1
              break
            fi

            sleep 0.5
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Database connection did not become ready."
            exit 1
          fi

          echo "Database connection established successfully."


      # =========================================================
      # CONFIGURE DATABASE URI
      #
      # Docker build will use:
      #
      # host.docker.internal:<port>
      # =========================================================

      - name: Configure database URI
        run: |
          set -euo pipefail

          if [[ "$DATABASE_URI_TEMPLATE" != *"[DB_HOST]"* ]]; then
            echo "ERROR: DATABASE_URI is missing [DB_HOST]."
            exit 1
          fi

          if [[ "$DATABASE_URI_TEMPLATE" != *"[DB_PORT]"* ]]; then
            echo "ERROR: DATABASE_URI is missing [DB_PORT]."
            exit 1
          fi

          DATABASE_URI="${DATABASE_URI_TEMPLATE//\[DB_HOST\]/host.docker.internal}"
          DATABASE_URI="${DATABASE_URI//\[DB_PORT\]/$DB_LOCAL_PORT}"

          if [[ "$DATABASE_URI" == *"[DB_HOST]"* ]] || \
             [[ "$DATABASE_URI" == *"[DB_PORT]"* ]]; then
            echo "ERROR: Database URI placeholders were not replaced."
            exit 1
          fi

          echo "::add-mask::$DATABASE_URI"

          {
            echo 'DATABASE_URI<<__DATABASE_URI_EOF__'
            printf '%s\n' "$DATABASE_URI"
            echo '__DATABASE_URI_EOF__'
          } >> "$GITHUB_ENV"

          echo "Database URI configured successfully."


      # =========================================================
      # TEST RUNNER DATABASE TUNNEL
      # =========================================================

      - name: Test database tunnel
        run: |
          set -euo pipefail

          if ! nc -z -w 5 127.0.0.1 "$DB_LOCAL_PORT"; then
            echo "ERROR: Database tunnel is unavailable."
            exit 1
          fi

          echo "Database tunnel test successful."


      # =========================================================
      # TEST DOCKER -> RUNNER HOST GATEWAY
      #
      # This catches the exact issue we were having BEFORE
      # starting the expensive application build.
      # =========================================================

      - name: Test Docker database access
        run: |
          set -euo pipefail

          docker run \
            --rm \
            --add-host host.docker.internal:host-gateway \
            alpine:3.22 \
            sh -c \
            "nc -z -w 5 host.docker.internal '$DB_LOCAL_PORT'" \
            >/dev/null 2>&1

          echo "Docker database access successful."


      # =========================================================
      # VERIFY DEFAULT BUILDER
      #
      # IMPORTANT:
      # Do NOT run docker/setup-buildx-action.
      #
      # We want the built-in Docker driver.
      # =========================================================

      - name: Verify Docker builder
        run: |
          set -euo pipefail

          DRIVER="$(
            docker buildx inspect \
              --format '{{.Driver}}'
          )"

          if [ "$DRIVER" != "docker" ]; then
            echo "ERROR: Docker builder is not using the docker driver."
            exit 1
          fi

          echo "Docker builder ready."


      # =========================================================
      # GHCR LOGIN
      # =========================================================

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # =========================================================
      # PREPARE IMAGE NAME
      # =========================================================

      - name: Prepare image name
        id: image
        run: |
          set -euo pipefail

          IMAGE="$REGISTRY/$IMAGE_NAME"

          IMAGE="$(
            printf '%s' "$IMAGE" |
            tr '[:upper:]' '[:lower:]'
          )"

          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"


      # =========================================================
      # BUILD + PUSH TO GHCR
      #
      # NOTE:
      # No setup-buildx-action.
      # No GHA cache exporter.
      #
      # Uses Docker daemon's built-in BuildKit.
      # =========================================================

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile

          push: true

          add-hosts: |
            host.docker.internal=host-gateway

          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          secret-envs: |
            NODE_ENV=NODE_ENV
            DATABASE_URI=DATABASE_URI
            CRON_SECRET=CRON_SECRET
            NEXT_PUBLIC_SERVER_URL=NEXT_PUBLIC_SERVER_URL
            PAYLOAD_SECRET=PAYLOAD_SECRET
            PREVIEW_SECRET=PREVIEW_SECRET
            RESEND_API_KEY=RESEND_API_KEY
            S3_ACCESS_KEY_ID=S3_ACCESS_KEY_ID
            S3_SECRET_ACCESS_KEY=S3_SECRET_ACCESS_KEY
            S3_BUCKET=S3_BUCKET
            S3_ENDPOINT=S3_ENDPOINT
            S3_REGION=S3_REGION
            TAILWIND_GENERATOR=TAILWIND_GENERATOR
            USE_RESEND=USE_RESEND
            IMAGE_HOSTS=IMAGE_HOSTS
            EMAIL_FROM_ADDRESS=EMAIL_FROM_ADDRESS
            EMAIL_FROM_NAME=EMAIL_FROM_NAME
            SMTP_HOST=SMTP_HOST
            SMTP_PORT=SMTP_PORT
            SMTP_USER=SMTP_USER
            SMTP_PASS=SMTP_PASS
            SMTP_SECURE=SMTP_SECURE


      # =========================================================
      # COMPLETE
      # =========================================================

      - name: Deployment complete
        run: |
          echo "Docker image built and published successfully."


      # =========================================================
      # DATABASE TUNNEL CLEANUP
      #
      # ALWAYS RUN
      # =========================================================

      - name: Cleanup database tunnel
        if: always()
        run: |
          set +e

          echo "Cleaning up database connection..."

          # -----------------------------------------------------
          # Stop local SSH tunnel
          # -----------------------------------------------------

          if [ -f /tmp/db-ssh-tunnel.pid ]; then

            SSH_PID="$(cat /tmp/db-ssh-tunnel.pid)"

            if kill -0 "$SSH_PID" 2>/dev/null; then

              kill "$SSH_PID" 2>/dev/null

              for _ in $(seq 1 10); do

                if ! kill -0 "$SSH_PID" 2>/dev/null; then
                  break
                fi

                sleep 0.2
              done

              if kill -0 "$SSH_PID" 2>/dev/null; then
                kill -9 "$SSH_PID" 2>/dev/null
              fi

            fi

            rm -f /tmp/db-ssh-tunnel.pid
          fi


          # -----------------------------------------------------
          # Remove remote VPS Docker proxy
          # -----------------------------------------------------

          if [ -f /tmp/db-tunnel-session ]; then

            SESSION_ID="$(cat /tmp/db-tunnel-session)"

            if ssh production \
              "/usr/local/bin/docker-tunnel-helper cleanup '$SESSION_ID'" \
              >/dev/null 2>&1
            then
              echo "Remote database tunnel cleaned up."
            else
              echo "WARNING: Remote database tunnel cleanup failed."
            fi

            rm -f /tmp/db-tunnel-session
          fi

          echo "Database cleanup complete."


      # =========================================================
      # SSH CLEANUP
      #
      # MUST REMAIN LAST
      # =========================================================

      - name: Cleanup SSH credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
          rm -f "$HOME/.ssh/config"

          echo "SSH credentials removed."