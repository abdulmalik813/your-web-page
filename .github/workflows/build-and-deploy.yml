name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DB_LOCAL_PORT: "27018"

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: prod

    steps:
      # =========================================================
      # LOAD SINGLE JSON SECRET
      # =========================================================

      - name: Load environment
        env:
          ENV_JSON: ${{ secrets.ENV }}
        run: |
          set -euo pipefail

          if [ -z "$ENV_JSON" ]; then
            echo "ERROR: ENV secret is missing."
            exit 1
          fi

          if ! printf '%s' "$ENV_JSON" \
            | jq -e 'type == "object"' \
            >/dev/null
          then
            echo "ERROR: ENV must be a valid JSON object."
            exit 1
          fi

          printf '%s' "$ENV_JSON" > /tmp/source-env.json
          chmod 600 /tmp/source-env.json

          echo "Environment loaded."


      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # =========================================================
      # VALIDATE ONLY CI/TUNNEL REQUIREMENTS
      # =========================================================

      - name: Validate configuration
        run: |
          set -euo pipefail

          REQUIRED=(
            SSH_HOST
            SSH_USER
            SSH_PRIVATE_KEY
            CF_ACCESS_CLIENT_ID
            CF_ACCESS_CLIENT_SECRET
            TUNNEL_TARGET_PORT_NETWORK
            DATABASE_URI
            DOKPLOY_DEPLOY_URL
          )

          for KEY in "${REQUIRED[@]}"; do

            VALUE="$(
              jq -r \
                --arg key "$KEY" \
                '.[$key] // empty' \
                /tmp/source-env.json
            )"

            if [ -z "$VALUE" ]; then
              echo "ERROR: Missing required configuration: $KEY"
              exit 1
            fi

          done

          echo "Configuration valid."


      # =========================================================
      # INSTALL CLOUDFLARED
      # =========================================================

      - name: Install cloudflared
        run: |
          set -euo pipefail

          sudo curl \
            -fsSL \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          echo "cloudflared installed."


      # =========================================================
      # CONFIGURE SSH
      # =========================================================

      - name: Configure SSH
        run: |
          set -euo pipefail

          SSH_HOST="$(
            jq -r '.SSH_HOST' /tmp/source-env.json
          )"

          SSH_USER="$(
            jq -r '.SSH_USER' /tmp/source-env.json
          )"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          jq -r '.SSH_PRIVATE_KEY' \
            /tmp/source-env.json \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          cat > "$HOME/.ssh/config" <<EOF
          Host production
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF

          chmod 600 "$HOME/.ssh/config"

          echo "SSH configured."


      # =========================================================
      # TEST VPS
      # =========================================================

      - name: Test VPS connection
        run: |
          set -euo pipefail

          export TUNNEL_SERVICE_TOKEN_ID="$(
            jq -r '.CF_ACCESS_CLIENT_ID' /tmp/source-env.json
          )"

          export TUNNEL_SERVICE_TOKEN_SECRET="$(
            jq -r '.CF_ACCESS_CLIENT_SECRET' /tmp/source-env.json
          )"

          ssh production '
            set -e

            test -x /usr/local/bin/docker-tunnel-helper
            docker info >/dev/null 2>&1
          '

          echo "VPS connection successful."


      # =========================================================
      # PARSE TUNNEL CONFIG
      #
      # FORMAT:
      # target,port,network
      # =========================================================

      - name: Validate tunnel configuration
        id: tunnel
        run: |
          set -euo pipefail

          VALUE="$(
            jq -r \
              '.TUNNEL_TARGET_PORT_NETWORK' \
              /tmp/source-env.json
          )"

          COMMA_COUNT="$(
            printf '%s' "$VALUE" |
            tr -cd ',' |
            wc -c
          )"

          if [ "$COMMA_COUNT" -ne 2 ]; then
            echo "ERROR: Tunnel configuration must be target,port,network"
            exit 1
          fi

          IFS=',' read -r TARGET PORT NETWORK <<< "$VALUE"

          TARGET="$(printf '%s' "$TARGET" | xargs)"
          PORT="$(printf '%s' "$PORT" | xargs)"
          NETWORK="$(printf '%s' "$NETWORK" | xargs)"

          if [ -z "$TARGET" ] || \
             [ -z "$PORT" ] || \
             [ -z "$NETWORK" ]; then
            echo "ERROR: Invalid tunnel configuration."
            exit 1
          fi

          if ! [[ "$TARGET" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: Invalid tunnel target."
            exit 1
          fi

          if ! [[ "$NETWORK" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: Invalid tunnel network."
            exit 1
          fi

          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid tunnel port."
            exit 1
          fi

          if (( PORT < 1 || PORT > 65535 )); then
            echo "ERROR: Invalid tunnel port."
            exit 1
          fi

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"

          echo "Tunnel configuration valid."


      # =========================================================
      # CREATE VPS DATABASE PROXY
      # =========================================================

      - name: Prepare database tunnel
        id: db
        env:
          DB_TARGET: ${{ steps.tunnel.outputs.target }}
          DB_TARGET_PORT: ${{ steps.tunnel.outputs.port }}
          DB_NETWORK: ${{ steps.tunnel.outputs.network }}
        run: |
          set -euo pipefail

          export TUNNEL_SERVICE_TOKEN_ID="$(
            jq -r '.CF_ACCESS_CLIENT_ID' /tmp/source-env.json
          )"

          export TUNNEL_SERVICE_TOKEN_SECRET="$(
            jq -r '.CF_ACCESS_CLIENT_SECRET' /tmp/source-env.json
          )"

          set +e

          RESULT="$(
            ssh production \
              "/usr/local/bin/docker-tunnel-helper prepare '$DB_TARGET' '$DB_TARGET_PORT' '$DB_NETWORK'" \
              2>&1
          )"

          EXIT_CODE=$?

          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "ERROR: Failed to prepare database tunnel."
            exit 1
          fi

          STATUS="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^STATUS=//p' |
            head -1
          )"

          SESSION_ID="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^SESSION_ID=//p' |
            head -1
          )"

          REMOTE_HOST="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^HOST=//p' |
            head -1
          )"

          REMOTE_PORT="$(
            printf '%s\n' "$RESULT" |
            sed -n 's/^PORT=//p' |
            head -1
          )"

          if [ "$STATUS" != "OK" ]; then
            echo "ERROR: Tunnel preparation failed."
            exit 1
          fi

          if [ -z "$SESSION_ID" ] || \
             [ -z "$REMOTE_HOST" ] || \
             ! [[ "$REMOTE_PORT" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid tunnel response."
            exit 1
          fi

          printf '%s\n' "$SESSION_ID" \
            > /tmp/db-tunnel-session

          chmod 600 /tmp/db-tunnel-session

          echo "remote_host=$REMOTE_HOST" >> "$GITHUB_OUTPUT"
          echo "remote_port=$REMOTE_PORT" >> "$GITHUB_OUTPUT"

          echo "Database proxy ready."


      # =========================================================
      # OPEN RUNNER -> VPS SSH TUNNEL
      # =========================================================

      - name: Open database SSH tunnel
        env:
          REMOTE_HOST: ${{ steps.db.outputs.remote_host }}
          REMOTE_PORT: ${{ steps.db.outputs.remote_port }}
        run: |
          set -euo pipefail

          export TUNNEL_SERVICE_TOKEN_ID="$(
            jq -r '.CF_ACCESS_CLIENT_ID' /tmp/source-env.json
          )"

          export TUNNEL_SERVICE_TOKEN_SECRET="$(
            jq -r '.CF_ACCESS_CLIENT_SECRET' /tmp/source-env.json
          )"

          ssh \
            -N \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -L "0.0.0.0:${DB_LOCAL_PORT}:${REMOTE_HOST}:${REMOTE_PORT}" \
            production \
            >/dev/null 2>&1 &

          SSH_PID=$!

          printf '%s\n' "$SSH_PID" \
            > /tmp/db-ssh-tunnel.pid

          chmod 600 /tmp/db-ssh-tunnel.pid

          READY=0

          for _ in $(seq 1 30); do

            if ! kill -0 "$SSH_PID" 2>/dev/null; then
              echo "ERROR: Database tunnel exited."
              exit 1
            fi

            if nc \
              -z \
              -w 1 \
              127.0.0.1 \
              "$DB_LOCAL_PORT" \
              2>/dev/null
            then
              READY=1
              break
            fi

            sleep 0.5

          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Database tunnel unavailable."
            exit 1
          fi

          echo "Database tunnel established."


      # =========================================================
      # BUILD ENVIRONMENT
      #
      # Starts with the single ENV JSON secret.
      #
      # CI-only settings are removed.
      #
      # DATABASE_URI:
      #
      # [DB_HOST] -> host.docker.internal
      # [DB_PORT] -> 27018
      # =========================================================

      - name: Prepare build environment
        run: |
          set -euo pipefail

          DATABASE_URI="$(
            jq -r '.DATABASE_URI' /tmp/source-env.json
          )"

          if [[ "$DATABASE_URI" != *"[DB_HOST]"* ]]; then
            echo "ERROR: DATABASE_URI missing [DB_HOST]."
            exit 1
          fi

          if [[ "$DATABASE_URI" != *"[DB_PORT]"* ]]; then
            echo "ERROR: DATABASE_URI missing [DB_PORT]."
            exit 1
          fi

          BUILD_DATABASE_URI="${DATABASE_URI//\[DB_HOST\]/host.docker.internal}"
          BUILD_DATABASE_URI="${BUILD_DATABASE_URI//\[DB_PORT\]/$DB_LOCAL_PORT}"

          jq \
            --arg databaseUri "$BUILD_DATABASE_URI" \
            '
              del(
                .SSH_HOST,
                .SSH_USER,
                .SSH_PRIVATE_KEY,
                .CF_ACCESS_CLIENT_ID,
                .CF_ACCESS_CLIENT_SECRET,
                .TUNNEL_TARGET_PORT_NETWORK,
                .DOKPLOY_DEPLOY_URL
              )
              |
              .DATABASE_URI = $databaseUri
            ' \
            /tmp/source-env.json \
            > /tmp/build-env.json

          chmod 600 /tmp/build-env.json

          echo "Build environment prepared."


      # =========================================================
      # TEST DATABASE PATH
      # =========================================================

      - name: Test database connection
        run: |
          set -euo pipefail

          if ! docker run \
            --rm \
            --add-host host.docker.internal:host-gateway \
            alpine:3.22 \
            sh -c \
            "nc -z -w 5 host.docker.internal '$DB_LOCAL_PORT'" \
            >/dev/null 2>&1
          then
            echo "ERROR: Docker cannot reach database tunnel."
            exit 1
          fi

          echo "Database connection ready."


      # =========================================================
      # GHCR LOGIN
      # =========================================================

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # =========================================================
      # IMAGE NAME
      # =========================================================

      - name: Prepare image name
        id: image
        run: |
          set -euo pipefail

          IMAGE="$REGISTRY/$IMAGE_NAME"

          IMAGE="$(
            printf '%s' "$IMAGE" |
            tr '[:upper:]' '[:lower:]'
          )"

          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"


      # =========================================================
      # BUILD
      # =========================================================

      - name: Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail

          DOCKER_BUILDKIT=1 docker build \
            --add-host \
            host.docker.internal:host-gateway \
            --secret \
            id=BUILD_ENV,src=/tmp/build-env.json \
            --build-arg \
            CACHEBUST="${GITHUB_SHA}" \
            --label \
            "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label \
            "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -f Dockerfile \
            .


      # =========================================================
      # PUSH
      # =========================================================

      - name: Push Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail

          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"

          echo "Docker image published."


      # =========================================================
      # DOKPLOY
      # =========================================================

      - name: Deploy to Dokploy
        run: |
          set -euo pipefail

          DOKPLOY_DEPLOY_URL="$(
            jq -r \
              '.DOKPLOY_DEPLOY_URL' \
              /tmp/source-env.json
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 30 \
            "$DOKPLOY_DEPLOY_URL" \
            >/dev/null

          echo "Dokploy deployment triggered."


      # =========================================================
      # CLEANUP TUNNEL
      # =========================================================

      - name: Cleanup database tunnel
        if: always()
        run: |
          set +e

          if [ -f /tmp/source-env.json ]; then

            export TUNNEL_SERVICE_TOKEN_ID="$(
              jq -r \
                '.CF_ACCESS_CLIENT_ID // empty' \
                /tmp/source-env.json \
                2>/dev/null
            )"

            export TUNNEL_SERVICE_TOKEN_SECRET="$(
              jq -r \
                '.CF_ACCESS_CLIENT_SECRET // empty' \
                /tmp/source-env.json \
                2>/dev/null
            )"

          fi

          if [ -f /tmp/db-ssh-tunnel.pid ]; then

            SSH_PID="$(
              cat /tmp/db-ssh-tunnel.pid
            )"

            kill "$SSH_PID" \
              >/dev/null 2>&1 || true

            sleep 1

            kill -9 "$SSH_PID" \
              >/dev/null 2>&1 || true

            rm -f /tmp/db-ssh-tunnel.pid

          fi

          if [ -f /tmp/db-tunnel-session ]; then

            SESSION_ID="$(
              cat /tmp/db-tunnel-session
            )"

            ssh production \
              "/usr/local/bin/docker-tunnel-helper cleanup '$SESSION_ID'" \
              >/dev/null 2>&1 || true

            rm -f /tmp/db-tunnel-session

          fi

          rm -f /tmp/build-env.json

          echo "Database tunnel cleaned up."


      # =========================================================
      # CLEANUP CREDENTIALS
      # =========================================================

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
          rm -f "$HOME/.ssh/config"
          rm -f /tmp/source-env.json

          echo "Credentials removed."