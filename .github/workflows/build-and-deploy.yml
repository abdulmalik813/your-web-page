name: Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: prod

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}

      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # =========================================================
      # INSTALL CLOUDFLARED
      # =========================================================

      - name: Install cloudflared
        run: |
          sudo curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared

          sudo chmod +x /usr/local/bin/cloudflared

          echo "Cloudflared:"
          cloudflared --version


      # =========================================================
      # INSTALL SSH PRIVATE KEY
      # =========================================================

      - name: Install SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          echo "SSH private key installed."


      # =========================================================
      # CONFIGURE SSH THROUGH CLOUDFLARE
      # =========================================================

      - name: Configure SSH
        run: |
          cat > "$HOME/.ssh/config" <<EOF
          Host production
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ${HOME}/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF

          chmod 600 "$HOME/.ssh/config"


      # =========================================================
      # VALIDATE CONFIG
      # =========================================================

      - name: Validate connection configuration
        run: |
          test -n "$SSH_HOST" || {
            echo "ERROR: SSH_HOST is missing"
            exit 1
          }

          test -n "$SSH_USER" || {
            echo "ERROR: SSH_USER is missing"
            exit 1
          }

          test -n "$TUNNEL_SERVICE_TOKEN_ID" || {
            echo "ERROR: CF_ACCESS_CLIENT_ID is missing"
            exit 1
          }

          test -n "$TUNNEL_SERVICE_TOKEN_SECRET" || {
            echo "ERROR: CF_ACCESS_CLIENT_SECRET is missing"
            exit 1
          }

          test -s "$HOME/.ssh/id_ed25519" || {
            echo "ERROR: SSH_PRIVATE_KEY is missing"
            exit 1
          }

          echo "Connection configuration OK."


      # =========================================================
      # TEST CLOUDFLARE + SSH
      # =========================================================

      - name: Test Cloudflare SSH connection
        run: |
          ssh production '
            set -e

            echo "======================================"
            echo " GitHub Actions SSH SUCCESS"
            echo "======================================"
            echo

            echo "Hostname:"
            hostname

            echo
            echo "User:"
            whoami

            echo
            echo "Kernel:"
            uname -r

            echo
            echo "Docker:"
            docker --version
          '


      # =========================================================
      # DATABASE TUNNEL
      # =========================================================

      - name: Prepare database tunnel
        run: |
          echo "// TODO: ask VPS helper for database/container tunnel details"


      - name: Open database SSH tunnel
        run: |
          echo "// TODO: open SSH local forward to returned VPS port"


      # =========================================================
      # DATABASE URL
      # =========================================================

      - name: Construct database URL
        run: |
          echo "// TODO: construct DATABASE_URI from tunnel details"


      # =========================================================
      # INSTALL
      # =========================================================

      - name: Install dependencies
        run: |
          echo "// TODO: setup pnpm and Node"
          echo "// TODO: pnpm install --frozen-lockfile"


      # =========================================================
      # BUILD
      # =========================================================

      - name: Build application
        run: |
          echo "// TODO: pnpm build"


      # =========================================================
      # DEPLOY
      # =========================================================

      - name: Deploy application
        run: |
          echo "// TODO: deploy application"


      # =========================================================
      # CLEANUP DATABASE TUNNEL
      # =========================================================

      - name: Cleanup database tunnel
        if: always()
        run: |
          echo "// TODO: stop SSH forward"
          echo "// TODO: tell VPS helper to remove temporary proxy"


      # =========================================================
      # CLEANUP SSH
      # =========================================================

      - name: Cleanup SSH credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
          rm -f "$HOME/.ssh/config"

          echo "SSH credentials removed."