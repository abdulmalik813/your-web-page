name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate version tag
        id: version
        run: |
          DATE=$(date +'%Y.%m.%d')
          RUN_NUMBER=${{ github.run_number }}
          VERSION="${DATE}.${RUN_NUMBER}"
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

