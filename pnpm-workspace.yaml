allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  sharp: true
  unrs-resolver: true
autoInstallPeers: true
fetchRetries: 2
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 60000
overrides:
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
preferOffline: true
storeDir: ~/.pnpm-store
strictDepBuilds: false
strictPeerDependencies: false
minimumReleaseAge: 0