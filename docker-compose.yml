services:
  # ==========================================================
  # MongoDB
  # ==========================================================
  mongodb:
    image: mongo:7
    restart: unless-stopped
    hostname: mongodb

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    volumes:
      - mongodb_data:/data/db
      - mongodb_key:/data/key

    ports:
      - "127.0.0.1:${MONGO_HOST_PORT}:27017"

    networks:
      coolify:
        aliases:
          - mongodb

    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e

        if [ ! -f /data/key/keyfile ]; then
          echo "Generating replica-set keyfile..."
          openssl rand -base64 756 > /data/key/keyfile
        fi

        chown 999:999 /data/key/keyfile
        chmod 400 /data/key/keyfile

        exec docker-entrypoint.sh mongod \
          --replSet rs0 \
          --bind_ip_all \
          --keyFile /data/key/keyfile

    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh
          "mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@127.0.0.1:27017/admin?directConnection=true"
          --quiet
          --eval 'db.adminCommand({ ping: 1 }).ok'
          | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s


  # ==========================================================
  # MongoDB Replica Set Init
  # ==========================================================
  mongodb-init:
    image: mongo:7
    restart: "no"

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - coolify

    environment:
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_HOST_PORT: ${MONGO_HOST_PORT}
      MONGO_SSH_PORT: ${MONGO_SSH_PORT}

    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e

        URI="mongodb://$${MONGO_USERNAME}:$${MONGO_PASSWORD}@mongodb:27017/admin?directConnection=true"

        echo "Waiting for MongoDB..."

        until mongosh "$$URI" \
          --quiet \
          --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1
        do
          sleep 2
        done

        echo "MongoDB is reachable."
        echo "Checking replica set..."

        STATUS=$$(mongosh "$$URI" --quiet --eval '
          try {
            rs.conf();
            print("CONFIGURED");
          } catch (e) {
            if (e.codeName === "NotYetInitialized" || e.code === 94) {
              print("NOT_INITIALIZED");
            } else {
              print("ERROR:" + e);
            }
          }
        ')

        if echo "$$STATUS" | grep -q "CONFIGURED"; then

          echo "Replica set rs0 is already initialized."
          echo "Skipping rs.initiate()."

        elif echo "$$STATUS" | grep -q "NOT_INITIALIZED"; then

          echo "Initializing replica set rs0..."

          mongosh "$$URI" --quiet --eval '
            rs.initiate({
              _id: "rs0",
              members: [
                {
                  _id: 0,
                  host: "mongodb:27017"
                }
              ]
            })
          '

          echo "Replica set initialized."

        else

          echo "Unable to determine replica-set state:"
          echo "$$STATUS"
          exit 1

        fi

        echo "Waiting for PRIMARY..."

        until mongosh "$$URI" \
          --quiet \
          --eval 'db.hello().isWritablePrimary' 2>/dev/null |
          grep -q '^true$'
        do
          sleep 2
        done

        echo ""
        echo "=============================================="
        echo " MongoDB is ready"
        echo "=============================================="
        echo ""
        echo "Username:"
        echo "$${MONGO_USERNAME}"
        echo ""
        echo "Password:"
        echo "$${MONGO_PASSWORD}"
        echo ""
        echo "Database:"
        echo "$${MONGO_DATABASE}"
        echo ""
        echo "Replica set:"
        echo "rs0"
        echo ""
        echo "VPS localhost port:"
        echo "$${MONGO_HOST_PORT}"
        echo ""
        echo "SSH tunnel:"
        echo ""
        echo "ssh -L $${MONGO_SSH_PORT}:127.0.0.1:$${MONGO_HOST_PORT} ssh.yourwebpage.ca"
        echo ""
        echo "External MongoDB URI through SSH:"
        echo ""
        echo "mongodb://$${MONGO_USERNAME}:$${MONGO_PASSWORD}@127.0.0.1:$${MONGO_SSH_PORT}/$${MONGO_DATABASE}?authSource=admin&directConnection=true"
        echo ""
        echo "Internal MongoDB URI:"
        echo ""
        echo "mongodb://$${MONGO_USERNAME}:$${MONGO_PASSWORD}@mongodb:27017/$${MONGO_DATABASE}?authSource=admin&replicaSet=rs0"
        echo ""


  # ==========================================================
  # Your Web Page / Payload CMS
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile

      # IMPORTANT:
      # Dockerfile RUN commands, including `pnpm build`,
      # use the Coolify network.
      network: coolify

      args:
        NODE_ENV: ${NODE_ENV}
        DATABASE_URI: ${DATABASE_URI}
        CRON_SECRET: ${CRON_SECRET}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        PREVIEW_SECRET: ${PREVIEW_SECRET}
        RESEND_API_KEY: ${RESEND_API_KEY}

        S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
        S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
        S3_BUCKET: ${S3_BUCKET}
        S3_ENDPOINT: ${S3_ENDPOINT}
        S3_REGION: ${S3_REGION}

        TAILWIND_GENERATOR: ${TAILWIND_GENERATOR}
        USE_RESEND: ${USE_RESEND}
        IMAGE_HOSTS: ${IMAGE_HOSTS}

        EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
        EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}

        SMTP_HOST: ${SMTP_HOST}
        SMTP_PORT: ${SMTP_PORT}
        SMTP_USER: ${SMTP_USER}
        SMTP_PASS: ${SMTP_PASS}
        SMTP_SECURE: ${SMTP_SECURE}

    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV}

      DATABASE_URI: ${DATABASE_URI}

      CRON_SECRET: ${CRON_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PREVIEW_SECRET: ${PREVIEW_SECRET}

      RESEND_API_KEY: ${RESEND_API_KEY}

      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}

      TAILWIND_GENERATOR: ${TAILWIND_GENERATOR}
      USE_RESEND: ${USE_RESEND}
      IMAGE_HOSTS: ${IMAGE_HOSTS}

      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE}

    networks:
      - coolify

    expose:
      - "3000"

    depends_on:
      mongodb:
        condition: service_healthy

      mongodb-init:
        condition: service_completed_successfully


# ============================================================
# Persistent Storage
# ============================================================
volumes:
  mongodb_data:
  mongodb_key:


# ============================================================
# Shared Coolify Network
# ============================================================
networks:
  coolify:
    external: true
    name: coolify