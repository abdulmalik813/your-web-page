services:
  # Single-node MongoDB replica set for local Payload transactions
  mongodb:
    image: mongo:8.0
    container_name: your-web-page-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { const status = rs.status(); quit(status.ok === 1 && status.myState === 1 ? 0 : 1) } catch (error) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}); quit(1) }",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Silo S3-compatible object storage
  silo:
    image: pgsty/silo:latest
    container_name: your-web-page-silo
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - silo_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  silo-s3-init:
    image: amazon/aws-cli:latest
    container_name: your-web-page-silo-s3-init
    depends_on:
      - silo
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      AWS_DEFAULT_REGION: ${S3_REGION:?S3_REGION is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        for attempt in $$(seq 1 30); do
          if aws --endpoint-url http://silo:9000 s3api list-buckets >/dev/null 2>&1; then
            break
          fi
          if [ "$$attempt" -eq 30 ]; then
            echo "Silo S3 did not become ready after 60 seconds" >&2
            exit 1
          fi
          sleep 2
        done
        if ! aws --endpoint-url http://silo:9000 s3api head-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1; then
          aws --endpoint-url http://silo:9000 s3api create-bucket --bucket "$$S3_BUCKET"
        fi
        policy="{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"PublicReadImages\",\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::$$S3_BUCKET/*\"}]}"
        aws --endpoint-url http://silo:9000 s3api put-bucket-policy --bucket "$$S3_BUCKET" --policy "$$policy"

  # Local catch-all SMTP inbox (web UI: http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: your-web-page-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  mongodb_data:
    driver: local

  silo_data:
    driver: local