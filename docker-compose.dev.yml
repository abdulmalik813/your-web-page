services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: heartculture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage for development)
  minio:
    image: minio/minio:latest
    container_name: heartculture-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client - Create bucket on startup
  minio-client:
    image: minio/mc:latest
    container_name: heartculture-minio-client
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/heartculture-media --ignore-existing;
      /usr/bin/mc anonymous set download myminio/heartculture-media;
      exit 0;
      "

  # Alternative MinIO Console UI (optional, better UI than default)
  minio-console:
    image: ghcr.io/georgmangold/console:latest
    container_name: heartculture-minio-console
    restart: unless-stopped
    environment:
      CONSOLE_MINIO_SERVER: http://minio:9000
      CONSOLE_MINIO_REGION: us-east-1
    ports:
      - "9002:9002"
    depends_on:
      - minio
    profiles:
      - full  # Only start with: docker-compose --profile full up

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
