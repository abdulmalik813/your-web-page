services:
  # Single-node MongoDB replica set for local Payload transactions
  mongodb:
    image: mongo:8.0
    container_name: your-web-page-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { const status = rs.status(); quit(status.ok === 1 && status.myState === 1 ? 0 : 1) } catch (error) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}); quit(1) }",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # MinIO (S3-compatible storage for development)
  minio:
    image: minio/minio:latest
    container_name: your-web-page-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client - Create bucket on startup
  minio-client:
    image: minio/mc:latest
    container_name: your-web-page-minio-client
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/your-web-page-media --ignore-existing;
      /usr/bin/mc anonymous set download myminio/your-web-page-media;
      exit 0;
      "

  # Alternative MinIO Console UI (optional, better UI than default)
  minio-console:
    image: ghcr.io/georgmangold/console:latest
    container_name: your-web-page-minio-console
    restart: unless-stopped
    environment:
      CONSOLE_MINIO_SERVER: http://minio:9000
      CONSOLE_MINIO_REGION: us-east-1
    ports:
      - "9002:9002"
    depends_on:
      - minio
    profiles:
      - full  # Only start with: docker-compose --profile full up

volumes:
  mongodb_data:
    driver: local
  minio_data:
    driver: local
